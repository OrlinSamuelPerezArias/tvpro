<style>

/* =========================================================
   GENERAL
========================================================= */

*{
    box-sizing:border-box;
    user-select:none;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    cursor:none;
}

video{
    width:100vw;
    height:100vh;
    object-fit:cover;
    background:#000;
}


/* =========================================================
   PANTALLA INICIAL
========================================================= */

#startOverlay{

    position:fixed;

    inset:0;

    z-index:1000;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(0,195,255,.15),
            transparent 40%
        ),
        rgba(0,0,0,.94);

    cursor:pointer;

}

.startBox{

    text-align:center;

    padding:40px 60px;

    border-radius:24px;

    border:1px solid rgba(0,195,255,.3);

    background:rgba(10,15,25,.82);

    backdrop-filter:blur(20px);

    box-shadow:
        0 0 70px rgba(0,195,255,.12);

}

.startIcon{

    font-size:65px;

    margin-bottom:15px;

}

.startTitle{

    font-size:30px;

    font-weight:800;

}

.startText{

    margin-top:10px;

    opacity:.55;

}


/* =========================================================
   INFO BAR
========================================================= */

#infoBar{

    position:fixed;

    left:0;

    bottom:0;

    width:100%;

    padding:
        30px
        45px
        40px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.96),
            rgba(0,0,0,.75),
            transparent
        );

    transform:translateY(100%);

    transition:.4s ease;

    z-index:100;

}

#infoContent{

    display:flex;

    align-items:center;

    gap:20px;

}

#canalNum{

    min-width:75px;

    font-size:55px;

    font-weight:800;

    color:#00c3ff;

}

#canalLogo{

    width:65px;

    height:65px;

    object-fit:contain;

    padding:7px;

    border-radius:12px;

    background:rgba(255,255,255,.08);

}

#canalNombre{

    font-size:26px;

    font-weight:700;

}

#estado{

    margin-top:4px;

    opacity:.6;

}


/* =========================================================
   NUMERO DE CANAL
========================================================= */

#inputDisplay{

    position:fixed;

    top:7%;

    right:5%;

    z-index:200;

    display:none;

    font-size:90px;

    font-weight:800;

    text-shadow:
        0 0 15px #000,
        0 0 40px rgba(0,195,255,.5);

/* =========================================================
   PANEL
========================================================= */

#channelList{

    max-width:92vw;

    height:100%;

    z-index:300;

    display:flex;

    flex-direction:column;

    background:
        linear-gradient(
            135deg,
            rgba(5,10,18,.98),
            rgba(5,15,25,.97)
        );

    backdrop-filter:blur(25px);

    border-right:
        1px solid
        rgba(0,195,255,.35);

    box-shadow:
        10px 0 60px rgba(0,0,0,.7);

    transform:translateX(-105%);

    transition:.35s ease;

}

#channelList.open{

    transform:translateX(0);

}


/* =========================================================
   HEADER
========================================================= */

.panelHeader{

    flex-shrink:0;

    padding:22px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

.logoTitle{

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.logoTitle h1{

            #fff,

.liveBadge{

    border-radius:20px;

    background:#ff304f;

    font-size:10px;

    font-weight:700;

/* =========================================================
   BUSCADOR
========================================================= */

.searchBox{

    border:

    background:

.searchIcon{

========================================================= */

#listItems::-webkit-scrollbar-thumb{

    background:#00c3ff;

    border-radius:10px;

/* =========================================================
   CANAL
========================================================= */

.channel-item{

    display:flex;

    align-items:center;

    gap:12px;

    padding:12px;

    margin-bottom:5px;

    border-radius:12px;

    border:
        1px solid

.channel-item:hover{

            rgba(0,195,255,.2),

.channel-number{

    width:35px;

    color:#00c3ff;

    font-size:12px;

    font-weight:700;

.channel-item img{

    padding:4px;

    border-radius:8px;

    background:

.channel-info{

.channel-name{

    opacity:.4;

}

.favorite.active{

    opacity:1;

/* =========================================================
   LOADING
========================================================= */

    z-index:500;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(0,0,0,.6);

    backdrop-filter:blur(5px);

    opacity:0;

    pointer-events:none;

    transition:.3s;

}

#loading.show{

    opacity:1;

}

.loaderBox{

    text-align:center;

}

.spinner{

    width:45px;

    height:45px;

    margin:
        auto
        auto
        15px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.15);

    border-top-color:#00c3ff;

    animation:
        spin
        .8s
        linear
        infinite;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   SIN RESULTADOS
========================================================= */

.empty{

    padding:50px 20px;

    text-align:center;

    opacity:.45;

}


/* =========================================================
   TOAST
========================================================= */

#toast{

    position:fixed;

    left:50%;

    bottom:35px;

    z-index:800;

    padding:12px 20px;

    border-radius:30px;

    background:
        rgba(10,15,20,.9);

    border:
        1px solid
        rgba(0,195,255,.25);

    backdrop-filter:blur(15px);

    transform:
        translate(-50%,100px);

    opacity:0;

    transition:.3s;

}

#toast.show{

    transform:
        translate(-50%,0);

    opacity:1;

}


/* =========================================================
   SEPARADORES
========================================================= */

.channel-section{

    padding:
        10px
        12px
        7px;

    color:#00c3ff;

    font-size:11px;

    font-weight:700;

    text-transform:uppercase;

    letter-spacing:1px;

    opacity:.7;

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

    }

    }

    #canalLogo{

        width:50px;

        height:50px;

    }

    #canalNombre{

        font-size:19px;

    }

    #inputDisplay{

        font-size:60px;

    }

}

</style>

</head>

/* =========================================================
   ACTUALIZAR CANAL ACTIVO
========================================================= */

function actualizarListaActiva(){

    const items =
        document.querySelectorAll(
            ".channel-item"
        );


    items.forEach(
        item => {

            const itemIndex =
                parseInt(
                    item.dataset.index
                );


            const activo =
                itemIndex === index;


            item.classList.toggle(
                "active",
                activo
            );


            if(
                activo &&
                channelList.classList.contains(
                    "open"
                )
            ){

                item.scrollIntoView({
                    block:"center",
                    behavior:"smooth"
                });

            }

        }
    );

}


/* =========================================================
   GENERAR FILTROS
========================================================= */

function generarFiltros(){

    const paises =
        [
            ...new Set(
                canales
                    .map(
                        canal =>
                            canal.pais
                    )
                    .filter(Boolean)
            )
        ]
        .sort();


    countryFilter.innerHTML = `

        <option value="all">
            🌎 Todos los países
        </option>

    `;


    paises.forEach(
        pais => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                pais;


            option.innerText =
                nombresPaises[pais] ||
                pais;


            countryFilter.appendChild(
                option
            );

        }
    );


    const categorias =
        [
            ...new Set(
                canales
                    .map(
                        canal =>
                            canal.categoria
                    )
                    .filter(Boolean)
            )
        ]
        .sort();


    categoryFilter.innerHTML = `

        <option value="all">
            📺 Todas
        </option>

    `;


    categorias.forEach(
        categoria => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                categoria;


            option.innerText =
                categoria;


            categoryFilter.appendChild(
                option

    );

}

        searchInput.value

            .trim();


    const pais =
        countryFilter.value;


    const categoria =
        categoryFilter.value;


    const filtrados =
        canales.filter(
            canal => {

                const coincideTexto =
                    !texto ||
                    canal.nombre
                        .toLowerCase()
                        .includes(texto);


                const coincidePais =
                    pais === "all" ||
                    canal.pais === pais;


                const coincideCategoria =
                    categoria === "all" ||
                    canal.categoria === categoria;


                return (
                    coincideTexto &&
                    coincidePais &&
                    coincideCategoria
                );

            }
        );


    listItems.innerHTML = "";


    if(
        !filtrados.length
    ){

            let grupo;


            if(
                canal.propio &&
                canal.pais === "DO"
            ){

                grupo =
                    "🇩🇴 Tus canales dominicanos";

            }

            else if(
                !canal.propio &&
                canal.pais === "DO"
            ){

                grupo =
                    "🇩🇴 República Dominicana · IPTV-org";

            }

            else if(
                canal.propio
            ){

                grupo =
                    "⭐ Otros canales";

            }

            else{

                grupo =
                    "🌎 IPTV-org · Internacional";

            }


            if(
                grupo !== ultimoGrupo
            ){

                const section =
                    document.createElement(
                        "div"
                    );


                section.className =
                    "channel-section";


                section.innerText =
                    grupo;


                listItems.appendChild(
                    section
                );


                ultimoGrupo =
                    grupo;

            }


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "channel-item";


            div.dataset.index =
                i;


            const favorito =
                favoritos.includes(
                    canal.nombre
                );


            div.innerHTML = `

                <div class="channel-number">

                    ${i + 1}

                </div>


                <img
                    src="${canal.logo || ""}"
                    onerror="
                        this.style.visibility='hidden'
                    "
                >


                <div class="channel-info">

                    <div class="channel-name">

                        ${escapeHTML(
                            canal.nombre
                        )}

                    </div>


                    <div class="channel-meta">

                        ${
                            nombresPaises[
                                canal.pais
                            ] ||
                            canal.pais ||
                            "TV"
                        }

                        •

                        ${
                            canal.categoria ||
                            "General"
                        }

                    </div>

                </div>


                <div
                    class="
                        favorite
                        ${
                            favorito
                            ? "active"
                            : ""
                        }
                    "
                >

                    ★

                </div>

            `;


            div.onclick =
                event => {

                    if(
                        event.target.classList.contains(
                            "favorite"
                        )
                    ){

                        toggleFavorito(
                            canal.nombre
                        );

                        return;

                    }


                    cargarCanal(
                        i
                    );


                    cerrarLista();

                };


            listItems.appendChild(
                div
            );

        }
    );


    actualizarContador(
        filtrados.length
    );


    actualizarListaActiva();

}


/* =========================================================
   CONTADOR
========================================================= */

function actualizarContador(
    numero
){

    document.getElementById(
        "channelCount"
    ).innerText =

        numero === 1

        ? "1 canal"

        : `${numero} canales`;

}


/* =========================================================
   FAVORITOS
========================================================= */

function toggleFavorito(
    nombre
){

    if(
        favoritos.includes(
            nombre
        )
    ){

        favoritos =
            favoritos.filter(
                item =>
                    item !== nombre
            );


        mostrarToast(
            "Eliminado de favoritos"
        );

    }

    else{

        favoritos.push(
            nombre
        );


        mostrarToast(
            "⭐ Añadido a favoritos"
        );

    }


    localStorage.setItem(
        "tvpro_favoritos",
        JSON.stringify(
            favoritos
        )
    );


    generarLista();

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHTML(
    texto
){

    return String(
        texto
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   MENU
========================================================= */

function toggleLista(){

    channelList.classList.toggle(
        "open"
    );


    if(
        channelList.classList.contains(
            "open"
        )
    ){

        generarLista();

    }

}


function cerrarLista(){

    channelList.classList.remove(
        "open"
    );

}


/* =========================================================
   CARGAR CANAL
========================================================= */

function cargarCanal(
    numero
){

    if(
        !canales.length
    )
        return;


    index =
        (
            numero +
            canales.length
        )
        %
        canales.length;


    const canal =
        canales[index];


    if(!canal)
        return;


    mostrarLoading(
        true
    );


    if(hls){

        try{

            hls.destroy();

        }

        catch(error){}


        hls = null;

    }


    const url =
        canal.url;


    /* =====================================================
       HLS.JS
    ===================================================== */

    if(
        Hls.isSupported()
    ){

        hls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                backBufferLength:30,

                maxBufferLength:30,

                maxMaxBufferLength:60

            });


        hls.loadSource(
            url
        );


        hls.attachMedia(
            video
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                video.play()
                    .catch(
                        () => {}
                    );


                mostrarLoading(
                    false
                );


                mostrarBarra(
                    "En vivo"
                );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.warn(
                    "HLS ERROR:",
                    data
                );


                if(
                    data.fatal
                ){

                    mostrarLoading(
                        false
                    );


                    mostrarBarra(
                        "Error de reproducción"
                    );


                    mostrarToast(
                        "⚠️ Este canal no está disponible"
                    );

                }

            }
        );

    }


    /* =====================================================
       SAFARI
    ===================================================== */

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            url;


        video.addEventListener(
            "loadedmetadata",
            () => {

                video.play()
                    .catch(
                        () => {}
                    );


                mostrarLoading(
                    false
                );


                mostrarBarra(
                    "En vivo"
                );

            },
            {
                once:true
            }
        );

    }


    else{

        mostrarLoading(
            false
        );


        mostrarToast(
            "⚠️ HLS no soportado"
        );

    }


    actualizarListaActiva();

}


/* =========================================================
   SONIDO
========================================================= */

function activarSonido(){

    if(
        !sonidoActivado
    ){

        video.muted =
            false;


        overlay.style.display =
            "none";


        sonidoActivado =
            true;

    }

}


/* =========================================================
   TECLADO
========================================================= */

function manejarTeclado(
    e
){

    const key =
        e.key.toLowerCase();


    const code =
        e.keyCode;


    activarSonido();


    /* =====================================================
       NUMEROS
    ===================================================== */

    if(
        /^\d$/.test(
            e.key
        )
    ){

        clearTimeout(
            inputTimer
        );


        inputBuffer +=
            e.key;


        displayNum.innerText =
            inputBuffer;


        displayNum.style.display =
            "block";


        inputTimer =
            setTimeout(
                () => {

                    const numero =
                        parseInt(
                            inputBuffer
                        ) - 1;


                    if(
                        numero >= 0 &&
                        numero < canales.length
                    ){

                        cargarCanal(
                            numero
                        );

                    }


                    inputBuffer = "";


                    displayNum.style.display =
                        "none";

                },
                1200
            );


        return;

    }


    /* =====================================================
       CANAL SIGUIENTE
    ===================================================== */

    if(
        key === "arrowup" ||
        key === "pageup" ||
        code === 33
    ){

        cargarCanal(
            index + 1
        );


        e.preventDefault();

    }


    /* =====================================================
       CANAL ANTERIOR
    ===================================================== */

    if(
        key === "arrowdown" ||
        key === "pagedown" ||
        code === 34
    ){

        cargarCanal(
            index - 1
        );


        e.preventDefault();

    }


    /* =====================================================
       MENU
    ===================================================== */

    if(
        key === "enter"
    ){

        toggleLista();

    }


    /* =====================================================
       ESC
    ===================================================== */

    if(
        key === "escape"
    ){

        cerrarLista();

    }


    /* =====================================================
       MUTE
    ===================================================== */

    if(
        key === "m"
    ){

        video.muted =
            !video.muted;


        mostrarToast(
            video.muted
            ? "🔇 Silenciado"
            : "🔊 Sonido activado"
        );

    }

}


/* =========================================================
   MOUSE
========================================================= */

function manejarMovimientoMouse(
    e
){

    activarSonido();


    if(
        channelList.classList.contains(
            "open"
        )
    ){

        return;

    }


    if(
        lastY === null
    ){

        lastY =
            e.clientY;

        return;

    }


    const deltaY =
        e.clientY -
        lastY;


    if(
        Math.abs(deltaY) >
        sensibilidad
    ){

        if(
            deltaY > 0
        ){

            cargarCanal(
                index - 1
            );

        }

        else{

            cargarCanal(
                index + 1
            );

        }


        lastY =
            e.clientY;

    }

}


/* =========================================================
   CARGAR IPTV-ORG
========================================================= */

async function cargarIPTVOrg(){

    mostrarLoading(
        true
    );


    mostrarToast(
        "🌎 Cargando IPTV-org..."
    );


    try{

        const [

            channelsResponse,

            streamsResponse,

            logosResponse

        ] =
            await Promise.all([

                fetch(
                    "https://iptv-org.github.io/api/channels.json"
                ),

                fetch(
                    "https://iptv-org.github.io/api/streams.json"
                ),

                fetch(
                    "https://iptv-org.github.io/api/logos.json"
                )

            ]);


        if(
            !channelsResponse.ok ||
            !streamsResponse.ok ||
            !logosResponse.ok
        ){

            throw new Error(
                "No se pudieron descargar los datos"
            );

        }


        const channels =
            await channelsResponse.json();


        const streams =
            await streamsResponse.json();


        const logos =
            await logosResponse.json();


        /* =================================================
           MAPA DE CANALES
        ================================================= */

        const channelMap =
            new Map();


        channels.forEach(
            canal => {

                channelMap.set(
                    canal.id,
                    canal
                );

            }
        );


        /* =================================================
           MAPA DE LOGOS
        ================================================= */

        const logoMap =
            new Map();


        logos.forEach(
            logo => {

                if(
                    logo.channel &&
                    logo.url
                ){

                    if(
                        !logoMap.has(
                            logo.channel
                        )
                    ){

                        logoMap.set(
                            logo.channel,
                            logo.url
                        );

                    }

                }

            }
        );


        /* =================================================
           CREAR STREAMS
        ================================================= */

        const encontrados = [];


        streams.forEach(
            stream => {

                if(
                    !stream.channel ||
                    !stream.url
                ){

                    return;

                }


                const canal =
                    channelMap.get(
                        stream.channel
                    );


                if(!canal)
                    return;


                const url =
                    stream.url
                        .toLowerCase();


                /*
                 * SOLO HLS
                 */

                if(
                    !url.includes(
                        ".m3u8"
                    ) &&
                    !url.includes(
                        "m3u8?"
                    )
                ){

                    return;

                }


                encontrados.push({

                    id:
                        canal.id,

                    nombre:
                        canal.name,

                    url:
                        stream.url,

                    logo:
                        logoMap.get(
                            canal.id
                        ) ||
                        canal.logo ||
                        "",

                    pais:
                        canal.country ||
                        "XX",

                    categoria:

                        canal.categories &&
                        canal.categories.length

                        ?

                        canal.categories[0]

                        :

                        "General",

                    propio:false

                });

            }
        );


        /* =================================================
           QUITAR DUPLICADOS
        ================================================= */

        const usados =
            new Set();


        const canalesIPTV =
            encontrados.filter(
                canal => {

                    const clave =
                        canal.id +
                        "|" +
                        canal.url;


                    if(
                        usados.has(
                            clave
                        )
                    ){

                        return false;

                    }


                    usados.add(
                        clave
                    );


                    return true;

                }
            );


        /* =================================================
           URLS QUE YA TENEMOS
        ================================================= */

        const urlsPropias =
            new Set(

                [

                    ...canalesDominicanosPropios,

                    ...otrosCanalesPropios

                ]

                .map(
                    canal =>
                        canal.url
                )

            );


        /* =================================================
           EVITAR DUPLICADOS
        ================================================= */

        const canalesIPTVSinRepetir =
            canalesIPTV.filter(
                canal =>
                    !urlsPropias.has(
                        canal.url
                    )
            );


        /* =================================================
           SEPARAR REPUBLICA DOMINICANA
        ================================================= */

        const canalesRD =
            canalesIPTVSinRepetir
                .filter(
                    canal =>
                        canal.pais === "DO"
                );


        /* =================================================
           RESTO DEL MUNDO
        ================================================= */

        const canalesInternacionales =
            canalesIPTVSinRepetir
                .filter(
                    canal =>
                        canal.pais !== "DO"
                );


        /* =================================================
           ORDENAR RD
        ================================================= */

        canalesRD.sort(
            (a,b) =>
                a.nombre.localeCompare(
                    b.nombre
                )
        );


        /* =================================================
           ORDENAR INTERNACIONALES
        ================================================= */

        canalesInternacionales.sort(
            (a,b) => {

                /*
                 * Primero país
                 */

                const pais =
                    (a.pais || "")
                    .localeCompare(
                        b.pais || ""
                    );


                if(
                    pais !== 0
                ){

                    return pais;

                }


                /*
                 * Después nombre
                 */

                return a.nombre.localeCompare(
                    b.nombre
                );

            }
        );


        /* =================================================
           ORDEN FINAL
        =================================================

           1.
           Tus dominicanos

           2.
           IPTV-org dominicanos

           3.
           Tus otros canales

           4.
           IPTV-org internacional
        */


        canales = [

            ...canalesDominicanosPropios,

            ...canalesRD,

            ...otrosCanalesPropios,

            ...canalesInternacionales

        ];


        /* =================================================
           FILTROS
        ================================================= */

        generarFiltros();


        generarLista();


        mostrarLoading(
            false
        );


        console.log(
            "================================"
        );


        console.log(
            "TV PRO"
        );


        console.log(
            "Tus canales RD:",
            canalesDominicanosPropios.length
        );


        console.log(
            "IPTV-org RD:",
            canalesRD.length
        );


        console.log(
            "Tus otros canales:",
            otrosCanalesPropios.length
        );


        console.log(
            "IPTV-org internacional:",
            canalesInternacionales.length
        );


        console.log(
            "TOTAL:",
            canales.length
        );


        console.log(
            "================================"
        );


        mostrarToast(

            `📺 ${canales.length} canales cargados`

        );


        /*
         * CARGAR PRIMER CANAL
         *
         * Siempre será:
         *
         * La Voz de María
         */

        if(
            canales.length > 0
        ){

            cargarCanal(
                0
            );

        }


    }

    catch(error){

        console.error(
            "Error IPTV-org:",
            error
        );


        mostrarLoading(
            false
        );


        mostrarToast(
            "❌ Error cargando IPTV-org"
        );


        /*
         * Aunque IPTV-org falle,
         * tus canales siguen disponibles.
         */

        canales = [

            ...canalesDominicanosPropios,

            ...otrosCanalesPropios

        ];


        generarFiltros();

        generarLista();


        if(
            canales.length
        ){

            cargarCanal(
                0
            );

        }

    }

}


/* =========================================================
   EVENTOS
========================================================= */

);


document.addEventListener(
    "mousemove",

);


document.addEventListener(

        lastY = null;

    }
);

========================================================= */

searchInput.addEventListener(

);


countryFilter.addEventListener(

);

========================================================= */

overlay.addEventListener(

);


/* =========================================================

========================================================= */

video.addEventListener(

        );

    }
);


/* =========================================================
   INICIO
========================================================= */

window.addEventListener(

    () => {

        /*

         */

        generarFiltros();

        generarLista();


        /*
         * Luego cargamos IPTV-org.
         */

        cargarIPTVOrg();

    }
);
