<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TV PRO</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;

    color:#fff;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

}

body{

    cursor:none;

}


/* =========================================================
   VIDEO
========================================================= */

#player{

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    object-fit:cover;

    background:#000;

}


/* =========================================================
   OVERLAY INICIAL
========================================================= */

#startOverlay{

    position:fixed;

    inset:0;

    z-index:1000;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

        radial-gradient(
            circle at center,
            rgba(0,195,255,.15),
            transparent 35%
        ),

        rgba(0,0,0,.93);

}

.startCard{

    width:360px;

    max-width:85vw;

    padding:42px 35px;

    text-align:center;

    border-radius:28px;

    border:

        1px solid
        rgba(255,255,255,.12);

    background:

        rgba(10,15,25,.82);

    backdrop-filter:
        blur(25px);

    box-shadow:

        0 30px 100px
        rgba(0,0,0,.7),

        0 0 60px
        rgba(0,195,255,.08);

}

.startIcon{

    font-size:65px;

    margin-bottom:20px;

}

.startTitle{

    font-size:32px;

    font-weight:800;

    letter-spacing:2px;

}

.startSubtitle{

    margin-top:10px;

    color:
        rgba(255,255,255,.5);

    font-size:14px;

}

.startHint{

    margin-top:28px;

    padding:12px;

    border-radius:12px;

    background:
        rgba(255,255,255,.05);

    font-size:12px;

    color:
        rgba(255,255,255,.65);

}


/* =========================================================
   GUÍA DE TV
========================================================= */

#guide{

    position:fixed;

    inset:0;

    z-index:500;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:45px;

    background:

        linear-gradient(
            to bottom,
            rgba(0,0,0,.62),
            rgba(0,0,0,.78)
        );

    backdrop-filter:
        blur(10px);

    opacity:0;

    visibility:hidden;

    pointer-events:none;

    transition:
        opacity .25s ease,
        visibility .25s ease;

}

#guide.open{

    opacity:1;

    visibility:visible;

    pointer-events:auto;

}


/* =========================================================
   PANEL PRINCIPAL
========================================================= */

.guidePanel{

    width:min(
        1050px,
        92vw
    );

    height:min(
        720px,
        88vh
    );

    display:flex;

    flex-direction:column;

    overflow:hidden;

    border-radius:28px;

    background:

        linear-gradient(
            145deg,
            rgba(9,16,27,.97),
            rgba(5,10,17,.96)
        );

    border:

        1px solid
        rgba(255,255,255,.12);

    box-shadow:

        0 40px 120px
        rgba(0,0,0,.75),

        0 0 80px
        rgba(0,195,255,.08);

}


/* =========================================================
   HEADER GUÍA
========================================================= */

.guideHeader{

    flex-shrink:0;

    padding:24px 30px 20px;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

}

.guideTop{

    display:flex;

    align-items:center;

    justify-content:space-between;

}

.guideBrand{

    display:flex;

    align-items:center;

    gap:13px;

}

.brandIcon{

    width:44px;

    height:44px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:13px;

    background:

        linear-gradient(
            135deg,
            #00c3ff,
            #0066ff
        );

    font-size:23px;

    box-shadow:

        0 8px 30px
        rgba(0,195,255,.25);

}

.brandName{

    font-size:25px;

    font-weight:800;

    letter-spacing:1px;

}

.brandLive{

    display:flex;

    align-items:center;

    gap:6px;

    margin-top:3px;

    font-size:10px;

    color:
        rgba(255,255,255,.45);

}

.liveDot{

    width:6px;

    height:6px;

    border-radius:50%;

    background:#ff304f;

    box-shadow:
        0 0 10px #ff304f;

}


/* =========================================================
   CATEGORÍAS
========================================================= */

.categories{

    display:flex;

    gap:9px;

    margin-top:22px;

    overflow:hidden;

}

.category{

    flex-shrink:0;

    padding:
        9px
        15px;

    border-radius:20px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.04);

    color:
        rgba(255,255,255,.55);

    font-size:12px;

    transition:.2s;

}

.category.active{

    color:#fff;

    background:
        rgba(0,195,255,.15);

    border-color:
        rgba(0,195,255,.45);

}


/* =========================================================
   LISTA
========================================================= */

.guideList{

    flex:1;

    overflow-y:auto;

    padding:18px 22px;

    scroll-behavior:smooth;

}

.guideList::-webkit-scrollbar{

    width:5px;

}

.guideList::-webkit-scrollbar-thumb{

    background:
        rgba(0,195,255,.5);

    border-radius:10px;

}


/* =========================================================
   CANAL
========================================================= */

.guideChannel{

    min-height:72px;

    display:grid;

    grid-template-columns:
        65px
        70px
        1fr
        150px;

    align-items:center;

    gap:15px;

    padding:
        9px
        15px;

    margin-bottom:7px;

    border-radius:17px;

    border:
        1px solid
        transparent;

    transition:
        transform .18s ease,
        background .18s ease,
        border .18s ease;

}


/* FOCUS */

.guideChannel.focused{

    transform:
        scale(1.015);

    background:

        linear-gradient(
            90deg,
            rgba(0,195,255,.2),
            rgba(0,195,255,.04)
        );

    border-color:
        rgba(0,195,255,.55);

    box-shadow:

        0 8px 30px
        rgba(0,0,0,.25),

        inset 3px 0 0
        #00c3ff;

}


/* NUMERO */

.channelNumber{

    font-size:20px;

    font-weight:800;

    color:
        rgba(255,255,255,.38);

    text-align:center;

}

.focused .channelNumber{

    color:#00c3ff;

}


/* LOGO */

.channelLogo{

    width:50px;

    height:50px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:12px;

    background:
        rgba(255,255,255,.06);

    overflow:hidden;

}

.channelLogo img{

    width:100%;

    height:100%;

    padding:6px;

    object-fit:contain;

}


/* NOMBRE */

.channelText{

    min-width:0;

}

.channelName{

    font-size:16px;

    font-weight:650;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.channelMeta{

    margin-top:4px;

    font-size:11px;

    color:
        rgba(255,255,255,.38);

}


/* ESTADO */

.channelStatus{

    justify-self:end;

    display:flex;

    align-items:center;

    gap:7px;

    padding:
        7px
        10px;

    border-radius:20px;

    background:
        rgba(255,255,255,.04);

    color:
        rgba(255,255,255,.42);

    font-size:10px;

}

.statusDot{

    width:6px;

    height:6px;

    border-radius:50%;

    background:#30d158;

    box-shadow:
        0 0 9px
        rgba(48,209,88,.7);

}


/* =========================================================
   FOOTER GUÍA
========================================================= */

.guideFooter{

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        15px 25px;

    border-top:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(0,0,0,.18);

}

.controlHints{

    display:flex;

    gap:20px;

    color:
        rgba(255,255,255,.42);

    font-size:11px;

}

.key{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    min-width:25px;

    height:22px;

    margin-right:5px;

    padding:0 6px;

    border-radius:6px;

    background:
        rgba(255,255,255,.1);

    border:
        1px solid
        rgba(255,255,255,.1);

    color:#fff;

    font-size:10px;

}

.guideCount{

    color:
        rgba(255,255,255,.35);

    font-size:11px;

}


/* =========================================================
   INFO DEL CANAL
========================================================= */

#infoBar{

    position:fixed;

    left:0;

    bottom:0;

    width:100%;

    z-index:200;

    padding:
        25px 45px 35px;

    background:

        linear-gradient(
            to top,
            rgba(0,0,0,.96),
            rgba(0,0,0,.72),
            transparent
        );

    transform:
        translateY(100%);

    transition:.4s ease;

}

#infoContent{

    display:flex;

    align-items:center;

    gap:20px;

}

.infoNumber{

    min-width:70px;

    font-size:52px;

    font-weight:850;

    color:#00c3ff;

}

#canalLogo{

    width:64px;

    height:64px;

    object-fit:contain;

    padding:7px;

    border-radius:13px;

    background:
        rgba(255,255,255,.07);

}

#canalNombre{

    font-size:25px;

    font-weight:700;

}

#estado{

    margin-top:4px;

    color:
        rgba(255,255,255,.5);

    font-size:12px;

}


/* =========================================================
   NUMERO GRANDE
========================================================= */

#inputDisplay{

    position:fixed;

    top:8%;

    right:6%;

    z-index:300;

    display:none;

    min-width:105px;

    padding:
        8px 17px;

    text-align:center;

    border-radius:17px;

    background:
        rgba(5,10,18,.75);

    border:
        1px solid
        rgba(0,195,255,.35);

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.4);

    font-size:54px;

    font-weight:800;

    color:#fff;

}


/* =========================================================
   LOADING
========================================================= */

#loading{

    position:fixed;

    inset:0;

    z-index:700;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(0,0,0,.35);

    backdrop-filter:
        blur(3px);

    opacity:0;

    pointer-events:none;

    transition:.2s;

}

#loading.show{

    opacity:1;

}

.loader{

    width:48px;

    height:48px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.15);

    border-top-color:#00c3ff;

    animation:
        spin .8s linear infinite;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   TOAST
========================================================= */

#toast{

    position:fixed;

    left:50%;

    bottom:35px;

    z-index:900;

    padding:
        11px 20px;

    border-radius:30px;

    background:
        rgba(5,10,18,.9);

    border:
        1px solid
        rgba(255,255,255,.1);

    backdrop-filter:
        blur(15px);

    transform:
        translate(-50%,80px);

    opacity:0;

    transition:.3s;

    font-size:12px;

}

#toast.show{

    transform:
        translate(-50%,0);

    opacity:1;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

    #guide{

        padding:15px;

    }

    .guidePanel{

        width:100%;

        height:92vh;

        border-radius:22px;

    }

    .guideHeader{

        padding:18px;

    }

    .guideList{

        padding:12px;

    }

    .guideChannel{

        grid-template-columns:
            45px
            55px
            1fr;

    }

    .channelStatus{

        display:none;

    }

    .controlHints{

        gap:8px;

    }

    .controlHints span:nth-child(3){

        display:none;

    }

    #infoBar{

        padding:
            20px;

    }

    .infoNumber{

        min-width:50px;

        font-size:40px;

    }

    #canalLogo{

        width:50px;

        height:50px;

    }

    #canalNombre{

        font-size:19px;

    }

}

</style>

</head>

];


/* =========================================================
   OTROS CANALES QUE TENÍAS
========================================================= */

const otrosCanalesPropios = [

    {
        nombre:"6 Wise TV",

        url:
        "https://live.enhdtv.com:8081/8150/index.m3u8",

        logo:

        pais:"US",

    {

        url:
        "https://amg26269-dogtv-amg26269c2-stirr-us-8504.playouts.now.amagi.tv/playlist.m3u8",

        logo:
        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkoMy8wfofxfOljm8fKQ9mxO2nIkdZ10U37g&s",

        pais:"US",

    }

];


/* =========================================================
   LISTA PRINCIPAL
========================================================= */

let canales = [

    ...canalesDominicanosPropios,

    ...otrosCanalesPropios

];


/* =========================================================
   VARIABLES
========================================================= */

let index = 0;

let guideIndex = 0;

let hls = null;

let guideOpen = false;

let sonidoActivado = false;

let inputBuffer = "";

let inputTimer = null;

/* =========================================================
   DOM

const video =
    document.getElementById(

    );


const overlay =

    );


const guide =

    );


const inputDisplay =

    );

        "loading"
    );


const toast =
    document.getElementById(
        "toast"
    );


/* =========================================================
   NOMBRES DE PAÍSES
========================================================= */

const paises = {

    MX:"🇲🇽 México",

    IT:"🇮🇹 Italia",

    PR:"🇵🇷 Puerto Rico",

    PA:"🇵🇦 Panamá",

    CR:"🇨🇷 Costa Rica",

    EC:"🇪🇨 Ecuador",

    GT:"🇬🇹 Guatemala",

    SV:"🇸🇻 El Salvador",

    NI:"🇳🇮 Nicaragua",

    BO:"🇧🇴 Bolivia",

    PY:"🇵🇾 Paraguay",

    UY:"🇺🇾 Uruguay"

};


/* =========================================================
   CATEGORÍA ACTUAL
========================================================= */

let categoriaActual = "TODOS";


/* =========================================================
   OBTENER CATEGORÍAS
========================================================= */

function obtenerCategorias(){

    const categoriasUnicas = [

        "TODOS",

        ...new Set(

            canales

                .map(
                    canal =>
                        canal.categoria
                )

                .filter(Boolean)

        )

    ];

    return categoriasUnicas;

}


/* =========================================================
   CREAR CATEGORÍAS
========================================================= */

function generarCategorias(){

    categories.innerHTML = "";


    const lista =
        obtenerCategorias();


    lista.forEach(
        (categoria, i) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "category";


            if(
                categoria ===
                categoriaActual
            ){

                div.classList.add(
                    "active"
                );

            }


            div.innerText =
                categoria === "TODOS"

                ? "📺 Todos"

                : categoria;


            div.dataset.category =
                categoria;


            categories.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   FILTRAR CANALES
========================================================= */

function obtenerCanalesFiltrados(){

    if(
        categoriaActual ===
        "TODOS"
    ){

        return canales;

    }


    return canales.filter(
        canal =>
            canal.categoria ===
            categoriaActual
    );

}


/* =========================================================
   GENERAR GUÍA
========================================================= */

function generarGuia(){

    generarCategorias();


    const lista =
        obtenerCanalesFiltrados();


    guideList.innerHTML = "";


    lista.forEach(
        (canal, posicion) => {

            const numeroReal =
                canales.indexOf(
                    canal
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "guideChannel";


            div.dataset.position =
                posicion;


            div.dataset.realIndex =
                numeroReal;


            div.innerHTML = `

                <div class="channelNumber">

                    ${numeroReal + 1}

                </div>


                <div class="channelLogo">

                    ${
                        canal.logo

                        ?

                        `<img
                            src="${canal.logo}"
                            onerror="
                                this.style.display='none'
                            "
                        >`

                        :

                        "📺"
                    }

                </div>


                <div class="channelText">

                    <div class="channelName">

                        ${escapeHTML(
                            canal.nombre
                        )}

                    </div>


                    <div class="channelMeta">

                        ${
                            paises[
                                canal.pais
                            ] ||
                            canal.pais ||
                            "Televisión"
                        }

                        &nbsp; • &nbsp;

                        ${
                            canal.categoria ||
                            "General"
                        }

                    </div>

                </div>


                <div class="channelStatus">

                    <span class="statusDot"></span>

                    EN VIVO

                </div>

            `;


            div.addEventListener(
                "click",
                () => {

                    guideIndex =
                        posicion;

                    reproducirSeleccion();

                }
            );


            guideList.appendChild(
                div
            );

        }
    );


    const actual =
        lista.findIndex(
            canal =>
                canales.indexOf(
                    canal
                ) === index
        );


    guideIndex =
        actual >= 0
        ? actual
        : 0;


    actualizarFoco();


    document.getElementById(
        "guideCount"
    ).innerText =

        `${lista.length} canales`;

}


/* =========================================================
   FOCO
========================================================= */

function actualizarFoco(){

    const items =
        guideList.querySelectorAll(
            ".guideChannel"
        );


    items.forEach(
        item =>
            item.classList.remove(
                "focused"
            )
    );


    if(
        !items.length
    )
        return;


    if(
        guideIndex < 0
    ){

        guideIndex =
            items.length - 1;

    }


    if(
        guideIndex >=
        items.length
    ){

        guideIndex =
            0;

    }


    const item =
        items[guideIndex];


    item.classList.add(
        "focused"
    );


    item.scrollIntoView({

        block:"center",

        behavior:"smooth"

    });

}


/* =========================================================
   MOVER FOCO
========================================================= */

function moverFoco(
    direccion
){

    const lista =
        obtenerCanalesFiltrados();


    if(
        !lista.length
    )
        return;


    guideIndex +=
        direccion;


    if(
        guideIndex < 0
    ){

        guideIndex =
            lista.length - 1;

    }


    if(
        guideIndex >=
        lista.length
    ){

        guideIndex =
            0;

    }


    actualizarFoco();

}


/* =========================================================
   CAMBIAR CATEGORÍA
========================================================= */

function cambiarCategoria(
    direccion
){

    const lista =
        obtenerCategorias();


    let posicion =
        lista.indexOf(
            categoriaActual
        );


    posicion +=
        direccion;


    if(
        posicion < 0
    ){

        posicion =
            lista.length - 1;

    }


    if(
        posicion >=
        lista.length
    ){

        posicion =
            0;

    }


    categoriaActual =
        lista[posicion];


    generarGuia();

}


/* =========================================================
   REPRODUCIR SELECCIÓN
========================================================= */

function reproducirSeleccion(){

    const lista =
        obtenerCanalesFiltrados();


    if(
        !lista.length
    )
        return;


    const canal =
        lista[guideIndex];


    const numero =
        canales.indexOf(
            canal
        );


    cerrarGuia();


    cargarCanal(
        numero
    );

}


/* =========================================================
   ABRIR GUÍA
========================================================= */

function abrirGuia(){

    guideOpen =
        true;


    guide.classList.add(
        "open"
    );


    generarGuia();

}


/* =========================================================
   CERRAR GUÍA
========================================================= */

function cerrarGuia(){

    guideOpen =
        false;


    guide.classList.remove(
        "open"
    );

}


/* =========================================================
   TOAST
========================================================= */

function mostrarToast(
    texto
){

    toast.innerText =
        texto;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );

}


/* =========================================================
   LOADING
========================================================= */

function mostrarLoading(
    mostrar
){

    loading.classList.toggle(
        "show",
        mostrar
    );

}


/* =========================================================
   INFO CANAL
========================================================= */

function mostrarInfo(
    estado="En vivo"
){

    const canal =
        canales[index];


    if(
        !canal
    )
        return;


    document.getElementById(
        "canalNum"
    ).innerText =
        index + 1;


    document.getElementById(
        "canalNombre"
    ).innerText =
        canal.nombre;


    document.getElementById(
        "canalLogo"
    ).src =
        canal.logo || "";


    document.getElementById(
        "estado"
    ).innerText =
        estado;


    infoBar.style.transform =
        "translateY(0)";


    clearTimeout(
        infoBar.timer
    );


    infoBar.timer =
        setTimeout(
            () => {

                infoBar.style.transform =
                    "translateY(100%)";

            },
            4000
        );

}


/* =========================================================
   CARGAR CANAL
========================================================= */

function cargarCanal(
    numero
){

    if(
        !canales.length
    )
        return;


    index =
        (
            numero +
            canales.length
        )
        %
        canales.length;


    const canal =
        canales[index];


    if(
        !canal
    )
        return;


    mostrarLoading(
        true
    );


    if(
        hls
    ){

        try{

            hls.destroy();

        }

        catch(e){}

        hls = null;

    }


    const url =
        canal.url;


    if(
        Hls.isSupported()
    ){

        hls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                backBufferLength:30,

                maxBufferLength:30

            });


        hls.loadSource(
            url
        );


        hls.attachMedia(
            video
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                video.play()
                    .catch(
                        () => {}
                    );


                mostrarLoading(
                    false
                );


                mostrarInfo(
                    "● En vivo"
                );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                console.warn(
                    data
                );


                if(
                    data.fatal
                ){

                    mostrarLoading(
                        false
                    );


                    mostrarInfo(
                        "Canal no disponible"
                    );


                    mostrarToast(
                        "⚠️ No se pudo reproducir este canal"
                    );

                }

            }
        );

    }

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src =
            url;


        video.addEventListener(
            "loadedmetadata",
            () => {

                video.play()
                    .catch(
                        () => {}
                    );


                mostrarLoading(
                    false
                );


                mostrarInfo(
                    "● En vivo"
                );

            },
            {
                once:true
            }
        );

    }

    else{

        mostrarLoading(
            false
        );

        mostrarToast(
            "⚠️ HLS no soportado"
        );

    }

}


/* =========================================================
   SONIDO
========================================================= */

function activarSonido(){

    if(
        !sonidoActivado
    ){

        video.muted =
            false;


        overlay.style.display =
            "none";


        sonidoActivado =
            true;

    }

}


/* =========================================================
   NUMEROS
========================================================= */

function procesarNumero(
    digito
){

    clearTimeout(
        inputTimer
    );


    inputBuffer +=
        digito;


    inputDisplay.innerText =
        inputBuffer;


    inputDisplay.style.display =
        "block";


    inputTimer =
        setTimeout(
            () => {

                const numero =
                    parseInt(
                        inputBuffer
                    );


                if(
                    numero >= 1 &&
                    numero <=
                    canales.length
                ){

                    cargarCanal(
                        numero - 1
                    );

                }

                else{

                    mostrarToast(
                        "Canal no encontrado"
                    );

                }


                inputBuffer =
                    "";


                inputDisplay.style.display =
                    "none";

            },
            1300
        );

}


/* =========================================================
   TECLADO / CONTROL REMOTO
========================================================= */

function manejarTeclado(e){

    console.log(
        "TECLA:",
        e.key,
        "CODE:",
        e.keyCode
    );

    activarSonido();

    const key = String(e.key || "").toLowerCase();
    const code = e.keyCode;

    /* =====================================================
       NUMEROS
    ===================================================== */

    if(/^\d$/.test(e.key)){

        procesarNumero(e.key);

        e.preventDefault();

        return;
    }


    /* =====================================================
       OK / ENTER
       
       En diferentes TV puede llegar como:
       Enter
       NumpadEnter
       Select
       OK
       o algunos keyCode
    ===================================================== */

    const esOK =
        key === "enter" ||
        key === "numpadenter" ||
        key === "select" ||
        key === "ok" ||
        code === 13 ||
        code === 23 ||
        code === 66;


    if(esOK){

        console.log("OK DETECTADO");

        if(guideOpen){

            // Si la guía está abierta,
            // OK reproduce el canal seleccionado.

            reproducirSeleccion();

        }else{

            // Si estamos viendo TV,
            // OK abre la lista.

            abrirGuia();

        }

        e.preventDefault();

        return;
    }


    /* =====================================================
       ARRIBA
    ===================================================== */

    if(
        key === "arrowup" ||
        key === "up" ||
        code === 38
    ){

        if(guideOpen){

            moverFoco(-1);

        }else{

            cargarCanal(index + 1);

        }

        e.preventDefault();

        return;
    }


    /* =====================================================
       ABAJO
    ===================================================== */

    if(
        key === "arrowdown" ||
        key === "down" ||
        code === 40
    ){

        if(guideOpen){

            moverFoco(1);

        }else{

            cargarCanal(index - 1);

        }

        e.preventDefault();

        return;
    }


    /* =====================================================
       IZQUIERDA
    ===================================================== */

    if(
        key === "arrowleft" ||
        key === "left" ||
        code === 37
    ){

        if(guideOpen){

            cambiarCategoria(-1);

        }

        e.preventDefault();

        return;
    }


    /* =====================================================
       DERECHA
    ===================================================== */

    if(
        key === "arrowright" ||
        key === "right" ||
        code === 39
    ){

        if(guideOpen){

            cambiarCategoria(1);

        }

        e.preventDefault();

        return;
    }


    /* =====================================================
       BACK / ESCAPE
    ===================================================== */

    if(
        key === "escape" ||
        key === "back" ||
        key === "browserback" ||
        code === 27 ||
        code === 8
    ){

        if(guideOpen){

            cerrarGuia();

        }

        e.preventDefault();

        return;
    }


    /* =====================================================
       GUIDE / EPG
       
       Algunos televisores envían:
       Guide
       EPG
       TVGuide
    ===================================================== */

    if(
        key === "guide" ||
        key === "epg" ||
        key === "tvguide"
    ){

        if(!guideOpen){

            abrirGuia();

        }else{

            cerrarGuia();

        }

        e.preventDefault();

        return;
    }


    /* =====================================================
       INFO
    ===================================================== */

    if(
        key === "info"
    ){

        mostrarInfo("● En vivo");

        e.preventDefault();

        return;
    }


    /* =====================================================
       MUTE
    ===================================================== */

    if(
        key === "m" ||
        key === "audiomute"
    ){

        video.muted =
            !video.muted;

        mostrarToast(
            video.muted
                ? "🔇 Silenciado"
                : "🔊 Sonido activado"
        );

        e.preventDefault();

        return;
    }

}
document.addEventListener(
    "keydown",
    manejarTeclado,
    true
);

CAPTURAR ENTER / OK DIRECTAMENTE

/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHTML(
    texto
){

    return String(
        texto
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================================================
   IPTV-ORG
========================================================= */

async function cargarIPTVOrg(){

    try{

        const [

            channelsResponse,

            streamsResponse,

            logosResponse

        ] =
            await Promise.all([

                fetch(
                    "https://iptv-org.github.io/api/channels.json"
                ),

                fetch(
                    "https://iptv-org.github.io/api/streams.json"
                ),

                fetch(
                    "https://iptv-org.github.io/api/logos.json"
                )

            ]);


        const channelData =
            await channelsResponse.json();


        const streamData =
            await streamsResponse.json();


        const logoData =
            await logosResponse.json();


        const channelMap =
            new Map();


        channelData.forEach(
            canal => {

                channelMap.set(
                    canal.id,
                    canal
                );

            }
        );


        const logoMap =
            new Map();


        logoData.forEach(
            logo => {

                if(
                    logo.channel &&
                    logo.url &&
                    !logoMap.has(
                        logo.channel
                    )
                ){

                    logoMap.set(
                        logo.channel,
                        logo.url
                    );

                }

            }
        );


        const encontrados = [];


        streamData.forEach(
            stream => {

                if(
                    !stream.channel ||
                    !stream.url
                )
                    return;


                const canal =
                    channelMap.get(
                        stream.channel
                    );


                if(
                    !canal
                )
                    return;


                const url =
                    stream.url.toLowerCase();


                if(
                    !url.includes(
                        ".m3u8"
                    ) &&
                    !url.includes(
                        "m3u8?"
                    )
                )
                    return;


                encontrados.push({

                    nombre:
                        canal.name,

                    url:
                        stream.url,

                    logo:
                        logoMap.get(
                            canal.id
                        ) ||
                        canal.logo ||
                        "",

                    pais:
                        canal.country ||
                        "XX",

                    categoria:
                        canal.categories &&
                        canal.categories.length

                        ?

                        canal.categories[0]

                        :

                        "General",

                    propio:false

                });

            }
        );


        /*
         * QUITAR DUPLICADOS
         */

        const urls =
            new Set();


        const unicos =
            encontrados.filter(
                canal => {

                    if(
                        urls.has(
                            canal.url
                        )
                    ){

                        return false;

                    }


                    urls.add(
                        canal.url
                    );


                    return true;

                }
            );


        /*
         * NO REPETIR TUS CANALES
         */

        const propias =
            new Set(

                [

                    ...canalesDominicanosPropios,

                    ...otrosCanalesPropios

                ]

                .map(
                    canal =>
                        canal.url
                )

            );


        const nuevos =
            unicos.filter(
                canal =>
                    !propias.has(
                        canal.url
                    )
            );


        /*
         * RD
         */

        const rd =
            nuevos
                .filter(
                    canal =>
                        canal.pais === "DO"
                )
                .sort(
                    (a,b) =>
                        a.nombre.localeCompare(
                            b.nombre
                        )
                );


        /*
         * INTERNACIONALES
         */

        const internacionales =
            nuevos
                .filter(
                    canal =>
                        canal.pais !== "DO"
                )
                .sort(
                    (a,b) => {

                        const pais =
                            (a.pais || "")
                            .localeCompare(
                                b.pais || ""
                            );


                        if(
                            pais !== 0
                        )
                            return pais;


                        return a.nombre.localeCompare(
                            b.nombre
                        );

                    }
                );


        /*
         * ORDEN FINAL
         *
         * IMPORTANTE:
         *
         * No tocamos los primeros
         * canales.
         */

        canales = [

            ...canalesDominicanosPropios,

            ...rd,

            ...otrosCanalesPropios,

            ...internacionales

        ];


        /*
         * Actualizar contador
         */

        if(
            guideOpen
        ){

            generarGuia();

        }


        mostrarToast(

            `📺 ${canales.length} canales disponibles`

        );


        console.log(
            "TV PRO cargado:",
            canales.length,
            "canales"
        );


    }

    catch(error){

        console.error(
            "IPTV-org:",
            error
        );


        mostrarToast(
            "⚠️ IPTV-org no disponible"
        );

    }

}

         */

);
