<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>TV PRO</title>

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
    box-sizing:border-box;
    user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    cursor:none;
}


/* =========================================================
   VIDEO
========================================================= */

#player{

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    object-fit:contain;

    background:#000;

}


/* =========================================================
   PANTALLA INICIAL
========================================================= */

#startOverlay{

    position:fixed;

    inset:0;

    z-index:1000;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(0,195,255,.12),
            rgba(0,0,0,.96) 65%
        );

}

.startCard{

    width:min(460px,90vw);

    padding:40px;

    text-align:center;

    border-radius:24px;

    background:rgba(10,15,20,.8);

    border:1px solid rgba(0,195,255,.25);

    box-shadow:
        0 30px 100px rgba(0,0,0,.8);

    backdrop-filter:blur(20px);

}

.startIcon{

    font-size:60px;

    margin-bottom:15px;

}

.startTitle{

    font-size:38px;

    font-weight:900;

    letter-spacing:4px;

}

.startSubtitle{

    margin-top:8px;

    color:#82929c;

}

.startHint{

    margin-top:30px;

    padding:16px;

    border-radius:14px;

    background:rgba(0,195,255,.08);

    color:#a9c9d7;

}

.startHint strong{

    color:#00c3ff;

    font-size:20px;

}


/* =========================================================
   NUMERO DEL CANAL
========================================================= */

#inputDisplay{

    position:fixed;

    top:8%;

    right:6%;

    z-index:500;

    display:none;

    min-width:100px;

    padding:10px 18px;

    text-align:center;

    font-size:70px;

    font-weight:900;

    letter-spacing:4px;

    color:white;

    border-radius:14px;

    background:rgba(0,0,0,.55);

    border:1px solid rgba(255,255,255,.12);

    text-shadow:
        0 0 20px rgba(0,195,255,.8);

    backdrop-filter:blur(10px);

}


/* =========================================================
   INFORMACIÓN DEL CANAL
========================================================= */

#infoBar{

    position:fixed;

    left:0;
    bottom:0;

    z-index:300;

    width:100%;

    padding:35px 50px 45px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.95),
            rgba(0,0,0,.55),
            transparent
        );

    transform:translateY(100%);

    transition:
        transform .35s ease;

}

#infoContent{

    display:flex;

    align-items:center;

    gap:18px;

}

#canalNum{

    min-width:70px;

    font-size:50px;

    font-weight:900;

    color:#00c3ff;

}

#canalLogo{

    width:64px;
    height:64px;

    object-fit:contain;

    padding:6px;

    border-radius:12px;

    background:rgba(255,255,255,.08);

}

#canalNombre{

    font-size:25px;

    font-weight:700;

}

#estado{

    margin-top:4px;

    color:#91a0a8;

    font-size:14px;

}


/* =========================================================
   MINI PREVIEW AL MANTENER 0
========================================================= */

#zeroPreview{

    position:fixed;

    left:50%;

    top:50%;

    z-index:700;

    width:520px;

    max-width:65vw;

    aspect-ratio:16/9;

    transform:
        translate(-50%,-50%)
        scale(.92);

    display:none;

    overflow:hidden;

    border-radius:18px;

    background:#000;

    border:1px solid rgba(0,195,255,.45);

    box-shadow:
        0 30px 100px rgba(0,0,0,.85),
        0 0 40px rgba(0,195,255,.12);

}

#zeroPreview.active{

    display:block;

    animation:
        previewIn .2s ease forwards;

}

@keyframes previewIn{

    from{

        opacity:0;

        transform:
            translate(-50%,-50%)
            scale(.85);

    }

    to{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(1);

    }

}

#previewVideo{

    width:100%;
    height:100%;

    object-fit:contain;

    background:#000;

}

#previewInfo{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:35px 20px 15px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.95),
            transparent
        );

}

#previewChannel{

    font-size:20px;

    font-weight:800;

}

#previewNumber{

    color:#00c3ff;

    font-size:13px;

    font-weight:700;

}


/* =========================================================
   CERO PROGRESS
========================================================= */

#zeroProgress{

    position:fixed;

    left:50%;

    bottom:8%;

    z-index:710;

    width:280px;

    height:5px;

    transform:
        translateX(-50%);

    display:none;

    overflow:hidden;

    border-radius:10px;

    background:rgba(255,255,255,.15);

}

#zeroProgressBar{

    width:0%;

    height:100%;

    background:#00c3ff;

}


/* =========================================================
   TOAST
========================================================= */

#toast{

    position:fixed;

    left:50%;

    bottom:45px;

    z-index:900;

    padding:12px 20px;

    border-radius:30px;

    background:rgba(10,15,20,.9);

    border:1px solid rgba(0,195,255,.25);

    transform:
        translate(-50%,20px);

    opacity:0;

    transition:.25s;

}

#toast.show{

    opacity:1;

    transform:
        translate(-50%,0);

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:700px){

    #zeroPreview{

        width:75vw;

        max-width:none;

    }

}

</style>

</head>

</div>


<div id="toast"></div>


<script>


/* =========================================================
   TUS CANALES ORIGINALES
   SIEMPRE VAN PRIMERO
========================================================= */

let canales = [

    {
        nombre:"La Voz de María",
        url:"https://live.lavozdemaria.com:3436/live/lavozdemarialive.m3u8",
        logo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScjT6ySNR02aPjARG_jnWlIe1mgABegRlk2A&s"

        logo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTjKQpOjimwanvyUmwkYeDrdACXWNABgZHghQ&s"
    },

    {

    },

    {

        url:"https://videoserver.tmcreativos.com:19360/kptjeckkaa/kptjeckkaa.m3u8",
        logo:"https://stscdn.teleuniversotv.com/wp-content/uploads/2020/11/Teleuniverso.webp"
    },

    {
        nombre:"6 Wise TV",
        url:"https://live.enhdtv.com:8081/8150/index.m3u8",
        logo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9JTxrz_0LCVISHKDdzNmZfi9tVwQs174J4Q&s"
    },

    {
        nombre:"Univision Noticias",
        url:"https://amg26269-dogtv-amg26269c2-stirr-us-8504.playouts.now.amagi.tv/playlist.m3u8",
        logo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkoMy8wfofxfOljm8fKQ9mxO2nIkdZ10U37g&s"
    },

    {
        nombre:"Canal 4 RD",
        url:"https://sh1.domint.net:19360/rtvd/rtvd/playlist.m3u8",
        logo:"https://certvdominicana.com/wp-content/uploads/2021/04/Logo-Canal-4RD.png"
    }

];


/* =========================================================
   IPTV-ORG RD
========================================================= */

const IPTV_RD =
    "https://iptv-org.github.io/iptv/countries/do.m3u";


/* =========================================================
   VARIABLES
========================================================= */

let index = 0;

let hls = null;

let previewHls = null;

let sonidoActivado = false;

let inputBuffer = "";

let inputTimer = null;

let ceroPresionado = false;

let ceroTimer = null;

let ceroAnimation = null;

let canalesCargados = false;


/* =========================================================
   ELEMENTOS
========================================================= */

const video =
    document.getElementById("player");

const overlay =
    document.getElementById("startOverlay");

const bar =
    document.getElementById("infoBar");

const displayNum =
    document.getElementById("inputDisplay");

const zeroPreview =
    document.getElementById("zeroPreview");

const previewVideo =
    document.getElementById("previewVideo");

const zeroProgress =
    document.getElementById("zeroProgress");

const zeroProgressBar =
    document.getElementById("zeroProgressBar");

const toast =
    document.getElementById("toast");


/* =========================================================
   TOAST
========================================================= */

function mostrarToast(texto){

    toast.innerText =
        texto;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toast.timer
    );

    toast.timer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================================================
   SONIDO
========================================================= */

function activarSonido(){

    if(sonidoActivado)
        return;

    sonidoActivado =
        true;

    video.muted =
        false;

    video.volume =
        1;

    overlay.style.display =
        "none";

    video.play()
        .catch(() => {});

}


/* =========================================================
   INFORMACIÓN
========================================================= */

function mostrarBarra(
    estado = "En vivo"
){

    const canal =
        canales[index];

    if(!canal)
        return;


    document.getElementById(
        "canalNum"
    ).innerText =
        String(index + 1)
        .padStart(2,"0");


    document.getElementById(
        "canalNombre"
    ).innerText =
        canal.nombre;


    document.getElementById(
        "canalLogo"
    ).src =
        canal.logo || "";


    document.getElementById(
        "estado"
    ).innerText =
        estado;


    bar.style.transform =
        "translateY(0)";


    clearTimeout(
        bar.timer
    );


    bar.timer =
        setTimeout(
            () => {

                bar.style.transform =
                    "translateY(100%)";

            },
            3500
        );

}


/* =========================================================
   REPRODUCIR CANAL
========================================================= */

function cargarCanal(numero){

    if(!canales.length)
        return;


    index =
        (
            numero +
            canales.length
        ) %
        canales.length;


    if(hls){

        hls.destroy();

        hls = null;

    }


    const url =
        canales[index].url;


    mostrarBarra(
        "Cargando..."
    );


    if(
        Hls.isSupported()
    ){

        hls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                backBufferLength:30

            });


        hls.loadSource(
            url
        );

        hls.attachMedia(
            video
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                video.play()
                    .catch(() => {});

                mostrarBarra(
                    "● En vivo"
                );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            (
                event,
                data
            ) => {

                if(
                    data.fatal
                ){

                    mostrarBarra(
                        "Sin señal"
                    );

                }

            }
        );


    }else{

        video.src =
            url;

        video.play()
            .catch(() => {});

    }

}


/* =========================================================
   PARSEAR IPTV-ORG
========================================================= */

function parseM3U(text){

    const lines =
        text.split(/\r?\n/);

    const resultado = [];

    let info = null;


    for(
        const lineRaw of lines
    ){

        const line =
            lineRaw.trim();


        if(
            line.startsWith(
                "#EXTINF"
            )
        ){

            const nombre =
                line.match(
                    /,(.*)$/
                );


            const logo =
                line.match(
                    /tvg-logo="([^"]*)"/
                );


            info = {

                nombre:
                    nombre
                        ? nombre[1].trim()
                        : "Canal",

                logo:
                    logo
                        ? logo[1]
                        : ""

            };


        }else if(

            info &&
            line &&
            !line.startsWith("#")

        ){

            resultado.push({

                nombre:
                    info.nombre,

                url:
                    line,

                logo:
                    info.logo

            });


            info = null;

        }

    }


    return resultado;

}


/* =========================================================
   CARGAR IPTV-ORG
========================================================= */

async function cargarCanalesIPTV(){

    try{

        const response =
            await fetch(
                IPTV_RD,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Playlist no disponible"
            );

        }


        const text =
            await response.text();


        const nuevos =
            parseM3U(
                text
            );


        /*
        ================================================
        IMPORTANTE:

        NO BORRAMOS LOS CANALES ORIGINALES.
        ================================================
        */

        const urls =
            new Set(
                canales.map(
                    canal =>
                        canal.url
                )
            );


        let agregados = 0;


        for(
            const canal of nuevos
        ){

            if(
                canal.url &&
                !urls.has(
                    canal.url
                )
            ){

                canales.push(
                    canal
                );

                urls.add(
                    canal.url
                );

                agregados++;

            }

        }


        canalesCargados =
            true;


        console.log(
            "Canales originales:",
            8
        );


        console.log(
            "Canales IPTV-org agregados:",
            agregados
        );


        console.log(
            "Total:",
            canales.length
        );


    }catch(error){

        console.error(
            "IPTV-org:",
            error
        );


        /*
        Si IPTV-org falla,
        los canales originales
        siguen funcionando.
        */

        mostrarToast(
            "Canales adicionales no disponibles"
        );

    }

}


/* =========================================================
   NUMERO DE CANAL
========================================================= */

function procesarNumero(
    digito
){

    clearTimeout(
        inputTimer
    );


    inputBuffer +=
        digito;


    displayNum.innerText =
        inputBuffer;


    displayNum.style.display =
        "block";


    inputTimer =
        setTimeout(
            () => {

                const numero =
                    parseInt(
                        inputBuffer,
                        10
                    );


                const posicion =
                    numero - 1;


                if(
                    !isNaN(numero) &&
                    posicion >= 0 &&
                    posicion < canales.length
                ){

                    cargarCanal(
                        posicion
                    );

                }else{

                    mostrarToast(
                        "Canal no disponible"
                    );

                }


                inputBuffer =
                    "";


                displayNum.style.display =
                    "none";


            },
            1200
        );

}


/* =========================================================
   MINI PREVIEW DEL 0
========================================================= */

function iniciarPreview(){

    const canal =
        canales[index];


    if(!canal)
        return;


    zeroPreview.classList.add(
        "active"
    );


    zeroProgress.style.display =
        "block";


    document.getElementById(
        "previewNumber"
    ).innerText =
        "CANAL " +
        String(index + 1)
        .padStart(2,"0");


    document.getElementById(
        "previewChannel"
    ).innerText =
        canal.nombre;


    /*
    ================================================
    REPRODUCIR PREVIEW
    ================================================
    */

    if(previewHls){

        previewHls.destroy();

        previewHls =
            null;

    }


    previewVideo.src =
        "";


    if(
        Hls.isSupported()
    ){

        previewHls =
            new Hls({
                enableWorker:true
            });


        previewHls.loadSource(
            canal.url
        );


        previewHls.attachMedia(
            previewVideo
        );


        previewHls.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                previewVideo.play()
                    .catch(() => {});

            }
        );

    }else{

        previewVideo.src =
            canal.url;

        previewVideo.play()
            .catch(() => {});

    }


    /*
    ================================================
    BARRA 3 SEGUNDOS
    ================================================
    */

    const inicio =
        Date.now();


    function animar(){

        if(!ceroPresionado)
            return;


        const transcurrido =
            Date.now() -
            inicio;


        const porcentaje =
            Math.min(
                transcurrido / 3000 * 100,
                100
            );


        zeroProgressBar.style.width =
            porcentaje + "%";


        if(
            porcentaje < 100
        ){

            ceroAnimation =
                requestAnimationFrame(
                    animar
                );

        }

    }


    animar();

}


/* =========================================================
   CERRAR PREVIEW
========================================================= */

function cerrarPreview(){

    zeroPreview.classList.remove(
        "active"
    );


    zeroProgress.style.display =
        "none";


    zeroProgressBar.style.width =
        "0%";


    if(previewHls){

        previewHls.destroy();

        previewHls =
            null;

    }


    previewVideo.pause();

    previewVideo.removeAttribute(
        "src"
    );

    previewVideo.load();


    if(ceroAnimation){

        cancelAnimationFrame(
            ceroAnimation
        );

        ceroAnimation =
            null;

    }

}


/* =========================================================
   PRESIONAR 0
========================================================= */

function presionarCero(){

    if(ceroPresionado)
        return;


    ceroPresionado =
        true;


    iniciarPreview();


    ceroTimer =
        setTimeout(
            () => {

                if(
                    ceroPresionado
                ){

                    /*
                    Al llegar a 3 segundos
                    simplemente mostramos
                    mensaje de lista.

                    No abrimos una guía enorme.
                    */

                    mostrarToast(
                        "📺 Lista de canales disponible"
                    );

                }

            },
            3000
        );

}


/* =========================================================
   SOLTAR 0
========================================================= */

function soltarCero(){

    ceroPresionado =
        false;


    clearTimeout(
        ceroTimer
    );


    ceroTimer =
        null;


    cerrarPreview();

}


/* =========================================================
   CONTROL REMOTO
========================================================= */

function manejarTeclado(e){

    activarSonido();


    const key =
        String(
            e.key || ""
        ).toLowerCase();


    const code =
        e.keyCode;


    /* =====================================================
       0
    ===================================================== */

    if(
        e.key === "0"
    ){

        presionarCero();

        e.preventDefault();

        return;

    }


    /* =====================================================
       NUMEROS 1-9
    ===================================================== */

    if(
        /^[1-9]$/.test(
            e.key
        )
    ){

        procesarNumero(
            e.key
        );

        e.preventDefault();

        return;

    }


    /* =====================================================
       ARRIBA
       
       Se soportan varias formas que pueden enviar
       navegadores de Smart TV.
    ===================================================== */

    if(
        key === "arrowup" ||
        key === "up" ||
        key === "channelup" ||
        key === "ch+" ||
        key === "pageup" ||
        code === 38 ||
        code === 33
    ){

        cargarCanal(
            index + 1
        );

        e.preventDefault();

        return;

    }


    /* =====================================================
       ABAJO
    ===================================================== */

    if(
        key === "arrowdown" ||
        key === "down" ||
        key === "channeldown" ||
        key === "ch-" ||
        key === "pagedown" ||
        code === 40 ||
        code === 34
    ){

        cargarCanal(
            index - 1
        );

        e.preventDefault();

        return;

    }


    /* =====================================================
       ENTER
    ===================================================== */

    if(
        key === "enter" ||
        key === "select" ||
        key === "ok" ||
        code === 13 ||
        code === 23
    ){

        clearTimeout(
            inputTimer
        );


        if(
            inputBuffer
        ){

            const numero =
                parseInt(
                    inputBuffer,
                    10
                );


            if(
                numero >= 1 &&
                numero <= canales.length
            ){

                cargarCanal(
                    numero - 1
                );

            }


            inputBuffer =
                "";

            displayNum.style.display =
                "none";

        }else{

            mostrarBarra(
                "● En vivo"
            );

        }


        e.preventDefault();

        return;

    }


    /* =====================================================
       ESC / BACK
    ===================================================== */

    if(
        key === "escape" ||
        key === "back" ||
        key === "browserback" ||
        code === 27
    ){

        inputBuffer =
            "";

        displayNum.style.display =
            "none";

        e.preventDefault();

        return;

    }

}


/* =========================================================
   ÚNICO LISTENER DE TECLADO
========================================================= */

document.addEventListener(
    "keydown",
    manejarTeclado,
    true
);


/* =========================================================
   KEYUP
========================================================= */

document.addEventListener(
    "keyup",
    function(e){

        if(
            e.key === "0"
        ){

            soltarCero();

            e.preventDefault();

        }

    },
    true
);


/* =========================================================
   CLICK PARA INICIAR
========================================================= */

document.addEventListener(
    "pointerdown",
    function(){

        activarSonido();

    },
    true
);


/* =========================================================
   INICIO
========================================================= */

window.addEventListener(
    "load",
    function(){

        /*
        PRIMERO REPRODUCIMOS
        TU PRIMER CANAL.
        */

        cargarCanal(0);


        /*
        DESPUÉS CARGAMOS IPTV-ORG.
        */

        cargarCanalesIPTV();

    }
);


/* =========================================================
   CLICK EN OVERLAY
========================================================= */

overlay.addEventListener(
    "click",
    function(){

        activarSonido();

    }
);


</script>

</body>

</html>
