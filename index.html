<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https: http:; media-src 'self' https: http: blob:; img-src 'self' https: http:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>TV PRO</title>
  <link rel="icon" href="./tvpro.ico" sizes="any">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./vendor/hls.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main class="stage" aria-label="TV PRO">
    <video id="video" class="stage-video" aria-label="Reproductor de televisión" tabindex="-1" muted playsinline preload="none"></video>

    <section id="welcome" class="welcome" aria-labelledby="welcome-title">
      <header class="welcome-header">
        <div class="brand" aria-label="TV PRO">
          <span class="brand-mark" aria-hidden="true"></span>
          <span aria-hidden="true">TV <b>PRO</b></span>
        </div>
      </header>
      <div class="welcome-main">
        <h1 id="welcome-title">Televisión en vivo</h1>
        <p id="welcome-prompt" class="welcome-prompt">Presiona <kbd>OK</kbd> para comenzar</p>
        <p id="welcome-text" class="welcome-status" role="status">Cargando las listas de canales…</p>
        <div class="welcome-actions">
          <button id="welcome-start" class="button-primary" type="button" aria-describedby="welcome-prompt">Ver TV</button>
        </div>
      </div>
      <footer class="welcome-footer" aria-label="Controles del mando">
        <span><kbd>↑</kbd> <kbd>↓</kbd> Canal</span>
        <span><kbd>←</kbd> <kbd>→</kbd> Volumen</span>
        <span><kbd>OK</kbd> Información</span>
        <span><kbd>1111</kbd> Canales</span>
      </footer>
    </section>

    <section id="playback-state" class="playback-state" aria-label="Estado de reproducción" hidden>
      <span class="playback-spinner" aria-hidden="true"></span>
      <p id="playback-message" role="status" aria-live="polite"></p>
      <button id="playback-resume" class="button-primary" type="button" hidden>Reproducir</button>
      <button id="playback-retry" class="button-secondary" type="button" hidden>Reintentar</button>
    </section>

    <output id="number-entry" class="number-entry" aria-label="Número marcado" hidden></output>

    <section id="hud" class="hud" aria-label="Información del canal" hidden>
      <div class="hud-info">
        <div id="hud-number" class="hud-number"></div>
        <img id="hud-logo" class="hud-logo" alt="" referrerpolicy="no-referrer" hidden>
        <div class="hud-copy">
          <p id="hud-detail" class="hud-detail"></p>
          <h2 id="hud-name"></h2>
          <p id="hud-program" class="hud-program" hidden></p>
        </div>
      </div>
      <div id="hud-actions" class="hud-actions">
        <button id="action-channels" class="hud-button hud-button-main" type="button">Canales <span class="hud-shortcut">1111</span></button>
      </div>
    </section>

    <aside id="panel" class="panel" role="dialog" aria-labelledby="panel-title" hidden>
      <header class="panel-header">
        <h2 id="panel-title">Canales</h2>
        <button id="panel-close" type="button" class="icon-button" aria-label="Cerrar panel" title="Cerrar panel">
          <span aria-hidden="true">×</span>
        </button>
      </header>

      <section id="channels-view" class="panel-view channels-view" aria-label="Catálogo de canales" hidden>
        <div class="channel-controls">
          <p class="channel-remote-hint">
            <span><kbd>CH+</kbd> <kbd>CH−</kbd> Mover</span>
            <span><kbd>00</kbd> para seleccionar</span>
            <span><kbd>1111</kbd> para salir</span>
          </p>
          <label class="channel-search-label" for="channel-search">Buscar por nombre o número</label>
          <div class="search-field">
            <span class="search-icon" aria-hidden="true"></span>
            <input id="channel-search" type="search" maxlength="120" autocomplete="off" spellcheck="false" placeholder="Canal o número">
          </div>
          <div class="channel-filters">
            <select id="channel-filter" aria-label="Lista de canales">
              <option value="all">Todos los canales</option>
              <option value="fixed">Canales fijos</option>
              <option value="rd">Principales de RD</option>
              <option value="cable">Cable</option>
              <option value="favorites">Favoritos</option>
              <option value="recent">Recientes</option>
              <option value="hidden">Ocultos</option>
            </select>
            <button id="channel-filter-toggle" class="channel-options" type="button" aria-expanded="false" aria-controls="channel-extra-filters">Filtros</button>
          </div>
          <div id="channel-extra-filters" class="channel-extra-filters" hidden>
            <select id="channel-category" aria-label="Categoría">
              <option value="">Todas las categorías</option>
            </select>
            <select id="channel-country" aria-label="País">
              <option value="">Todos los países</option>
            </select>
            <select id="channel-language" aria-label="Idioma">
              <option value="">Todos los idiomas</option>
            </select>
          </div>
        </div>
        <div class="channel-summary">
          <p id="channel-count" class="channel-count" role="status" aria-live="polite"></p>
          <div class="channel-utilities">
            <button id="channel-options" class="channel-options" type="button" disabled>Opciones del canal</button>
            <button id="channel-more" class="channel-options" type="button">Más opciones</button>
          </div>
        </div>
        <div id="channel-viewport" class="channel-viewport" role="region" aria-label="Resultados de canales">
          <div id="channel-list" class="channel-list"></div>
        </div>
      </section>

      <section id="options-view" class="panel-view panel-form" aria-label="Más opciones" hidden>
        <div class="playback-options">
          <button id="action-favorites" class="button-secondary" type="button">Favoritos</button>
          <button id="action-previous" class="button-secondary" type="button">Canal anterior</button>
          <button id="action-star" class="button-secondary" type="button" aria-pressed="false">Añadir a favoritos</button>
          <button id="action-guide" class="button-secondary" type="button">Guía</button>
          <button id="action-tracks" class="button-secondary" type="button">Audio y calidad</button>
          <button id="action-mute" class="button-secondary" type="button" aria-pressed="false">Silenciar</button>
          <button id="action-fullscreen" class="button-secondary" type="button">Pantalla completa</button>
          <button id="action-settings" class="button-secondary" type="button">Configuración</button>
        </div>
      </section>

      <section id="settings-view" class="panel-view panel-form" aria-label="Configuración" hidden>
        <div id="settings-content"></div>
      </section>

      <section id="tracks-view" class="panel-view panel-form" aria-label="Audio y calidad" hidden>
        <div class="settings-section settings-grid">
          <label class="field">Calidad de video
            <select id="quality-select" disabled><option value="-1">Automática</option></select>
          </label>
          <label class="field">Pista de audio
            <select id="audio-select" disabled><option value="-1">Predeterminada</option></select>
          </label>
        </div>
      </section>

      <section id="guide-view" class="panel-view panel-form" aria-label="Guía de programación" hidden>
        <div id="guide-content"></div>
      </section>

      <section id="pin-view" class="panel-view panel-form" aria-label="Verificación de PIN" hidden>
        <form id="pin-form" class="settings-section">
          <label class="field">PIN del perfil
            <input id="pin-input" name="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" pattern="[0-9]{4,8}" required>
          </label>
          <p id="pin-message" role="status" aria-live="polite"></p>
          <div class="settings-actions">
            <button type="submit" class="button-primary">Confirmar</button>
            <button id="pin-cancel" type="button" class="button-secondary">Cancelar</button>
          </div>
        </form>
      </section>
    </aside>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript><div class="noscript">Activa JavaScript para abrir TV PRO.</div></noscript>
  </main>
</body>
</html>
