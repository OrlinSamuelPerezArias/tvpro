/* =========================================================

========================================================= */

#toast{

    position:fixed;

    left:50%;

    bottom:40px;

    transform:
        translate(-50%,20px);

    opacity:0;

    padding:12px 20px;

    border-radius:30px;

    background:rgba(10,15,20,.9);

    border:1px solid rgba(0,195,255,.3);

    color:#fff;

    transition:.3s;

    pointer-events:none;

}

#toast.show{

    opacity:1;

    transform:
        translate(-50%,0);

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

    .guidePreview{

    }

    .guidePanel{

    }

    .guideFooter{

    }

}

</style>

<script>


/* =========================================================

let canales = [

        logo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkoMy8wfofxfOljm8fKQ9mxO2nIkdZ10U37g&s"

];


/* =========================================================
   CONFIGURACIÓN IPTV-ORG
========================================================= */

const IPTV_DOMINICANA =
    "https://iptv-org.github.io/iptv/countries/do.m3u";


/* =========================================================
   VARIABLES
========================================================= */

let index = 0;

let hls = null;

let sonidoActivado = false;

let inputBuffer = "";

let inputTimer = null;

let guideOpen = false;

let guideIndex = 0;

let canalesIPTVCargados = false;

let mouseLastY = null;

let mouseTimer = null;


/* =========================================================
   ELEMENTOS
========================================================= */

const video =
    document.getElementById("player");

const overlay =
    document.getElementById("startOverlay");

const bar =
    document.getElementById("infoBar");

const displayNum =
    document.getElementById("inputDisplay");

const guide =
    document.getElementById("guide");

const listItems =
    document.getElementById("listItems");

const toast =
    document.getElementById("toast");


/* =========================================================
   TOAST
========================================================= */

function mostrarToast(texto){

    toast.innerText = texto;

    toast.classList.add("show");

    clearTimeout(toast.timer);

    toast.timer = setTimeout(() => {

        toast.classList.remove("show");

    },1800);

}


/* =========================================================
   SONIDO
========================================================= */

function activarSonido(){

    if(sonidoActivado)
        return;

    sonidoActivado = true;

    video.muted = false;

    video.volume = 1;

    overlay.style.display = "none";

    video.play().catch(() => {});

}


/* =========================================================
   MOSTRAR INFO
========================================================= */

function mostrarBarra(
    texto = "En vivo"
){

    if(!canales[index])
        return;

    const canal =
        canales[index];

    document.getElementById(
        "canalNum"
    ).innerText =
        String(index + 1).padStart(2,"0");

    document.getElementById(
        "canalNombre"
    ).innerText =
        canal.nombre;

    document.getElementById(
        "canalLogo"
    ).src =
        canal.logo || "";

    document.getElementById(
        "estado"
    ).innerText =
        texto;

    bar.style.transform =
        "translateY(0)";

    clearTimeout(bar.timer);

    bar.timer = setTimeout(() => {

        bar.style.transform =
            "translateY(100%)";

    },4000);

}


/* =========================================================
   REPRODUCIR CANAL
========================================================= */

function cargarCanal(i){

    if(!canales.length)
        return;

    index =
        (i + canales.length)
        % canales.length;


    if(hls){

        hls.destroy();

        hls = null;

    }


    const url =
        canales[index].url;


    mostrarBarra(
        "Cargando..."
    );


    if(
        Hls.isSupported()
    ){

        hls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                backBufferLength:30

            });


        hls.loadSource(url);

        hls.attachMedia(video);


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                video.play()
                    .catch(() => {});

                mostrarBarra(
                    "● En vivo"
                );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(
                event,
                data
            ){

                if(
                    data.fatal
                ){

                    mostrarBarra(
                        "Error de señal"
                    );

                }

            }
        );


    }else{

        video.src =
            url;

        video.play()
            .catch(() => {});

    }


    if(guideOpen){

        guideIndex =
            index;

        actualizarGuia();

    }

}


/* =========================================================
   PARSEAR M3U IPTV-ORG
========================================================= */

function parseM3U(text){

    const lineas =
        text.split(/\r?\n/);

    const resultado = [];

    let info = null;


    for(
        let i = 0;
        i < lineas.length;
        i++
    ){

        const linea =
            lineas[i].trim();


        if(
            linea.startsWith(
                "#EXTINF"
            )
        ){

            const nombreMatch =
                linea.match(
                    /,(.*)$/
                );


            const logoMatch =
                linea.match(
                    /tvg-logo="([^"]*)"/
                );


            const grupoMatch =
                linea.match(
                    /group-title="([^"]*)"/
                );


            info = {

                nombre:
                    nombreMatch
                        ? nombreMatch[1].trim()
                        : "Canal",

                logo:
                    logoMatch
                        ? logoMatch[1]
                        : "",

                grupo:
                    grupoMatch
                        ? grupoMatch[1]
                        : "República Dominicana"

            };

        }else if(

            info &&
            linea &&
            !linea.startsWith("#")

        ){

            resultado.push({

                nombre:
                    info.nombre,

                url:
                    linea,

                logo:
                    info.logo,

                grupo:
                    info.grupo

            });

            info = null;

        }

    }


    return resultado;

}


/* =========================================================
   CARGAR CANALES DOMINICANOS
========================================================= */

async function cargarCanalesDominicanos(){

    if(canalesIPTVCargados)
        return;


    try{

        mostrarToast(
            "🇩🇴 Cargando canales dominicanos..."
        );


        const respuesta =
            await fetch(
                IPTV_DOMINICANA,
                {
                    cache:"no-store"
                }
            );


        if(!respuesta.ok){

            throw new Error(
                "No se pudo descargar la playlist"
            );

        }


        const texto =
            await respuesta.text();


        const nuevos =
            parseM3U(texto);


        /*
        ================================================
        EVITAR DUPLICADOS
        ================================================
        */

        const urlsExistentes =
            new Set(
                canales.map(
                    c => c.url
                )
            );


        for(
            const canal of nuevos
        ){

            if(
                !urlsExistentes.has(
                    canal.url
                )
            ){

                canales.push(
                    canal
                );

                urlsExistentes.add(
                    canal.url
                );

            }

        }


        canalesIPTVCargados =
            true;


        generarLista();

        actualizarGuia();


        mostrarToast(
            "🇩🇴 " +
            nuevos.length +
            " canales agregados"
        );


    }catch(error){

        console.error(
            "Error IPTV-org:",
            error
        );


        generarLista();


        mostrarToast(
            "No se pudieron cargar los canales adicionales"
        );

    }

}


/* =========================================================
   GENERAR LISTA
========================================================= */

function generarLista(){

    listItems.innerHTML = "";


    canales.forEach(
        (canal,i) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "channel-item";


            div.dataset.index =
                i;


            const numero =
                String(i + 1)
                .padStart(2,"0");


            div.innerHTML = `

                <div class="channel-number">
                    ${numero}
                </div>

                <img
                    src="${escapeHTML(canal.logo || "")}"
                    alt=""
                    onerror="this.style.visibility='hidden'"
                >

                <div class="channel-info">

                    <div class="channel-name">
                        ${escapeHTML(canal.nombre)}
                    </div>

                    <div class="channel-status">
                        ● EN VIVO
                    </div>

                </div>

            `;


            div.addEventListener(
                "click",
                () => {

                    guideIndex = i;

                    reproducirSeleccion();

                }
            );


            listItems.appendChild(
                div
            );

        }
    );


    actualizarGuia();

}


/* =========================================================
   SEGURIDAD HTML
========================================================= */

function escapeHTML(text){

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ABRIR GUÍA
========================================================= */

function abrirGuia(){

    if(!canales.length)
        return;


    guideOpen =
        true;


    guideIndex =
        index;


    guide.classList.add(
        "open"
    );


    actualizarGuia();


    setTimeout(
        () => {

            const item =
                document.querySelector(
                    `.channel-item[data-index="${guideIndex}"]`
                );


            if(item){

                item.scrollIntoView({
                    block:"center"
                });

            }

        },
        50
    );

}


/* =========================================================
   CERRAR GUÍA
========================================================= */

function cerrarGuia(){

    guideOpen =
        false;

    guide.classList.remove(
        "open"
    );

}


/* =========================================================
   ACTUALIZAR GUÍA
========================================================= */

function actualizarGuia(){

    if(!canales.length)
        return;


    document.getElementById(
        "guideCount"
    ).innerText =
        canales.length +
        " canales";


    const items =
        document.querySelectorAll(
            ".channel-item"
        );


    items.forEach(
        (item,i) => {

            item.classList.toggle(
                "focused",
                i === guideIndex
            );

            item.classList.toggle(
                "playing",
                i === index
            );

        }
    );


    const canal =
        canales[guideIndex];


    if(!canal)
        return;


    document.getElementById(
        "previewLogo"
    ).src =
        canal.logo || "";


    document.getElementById(
        "previewNumber"
    ).innerText =
        "CANAL " +
        String(guideIndex + 1)
        .padStart(2,"0");


    document.getElementById(
        "previewName"
    ).innerText =
        canal.nombre;


    const seleccionado =
        document.querySelector(
            `.channel-item[data-index="${guideIndex}"]`
        );


    if(
        seleccionado &&
        guideOpen
    ){

        seleccionado.scrollIntoView({
            block:"center",
            behavior:"smooth"
        });

    }

}


/* =========================================================
   MOVER FOCO
========================================================= */

function moverFoco(direccion){

    if(!canales.length)
        return;


    guideIndex +=
        direccion;


    if(
        guideIndex < 0
    ){

        guideIndex =
            canales.length - 1;

    }


    if(
        guideIndex >= canales.length
    ){

        guideIndex = 0;

    }


    actualizarGuia();

}


/* =========================================================
   SELECCIONAR
========================================================= */

function reproducirSeleccion(){

    if(!canales[guideIndex])
        return;


    const seleccionado =
        guideIndex;


    cerrarGuia();

    cargarCanal(
        seleccionado
    );

}


/* =========================================================
   NUMEROS
========================================================= */

function procesarNumero(digito){

    clearTimeout(
        inputTimer
    );


    /*
    ================================================
    0 = ABRIR GUÍA
    ================================================
    */

    if(
        digito === "0"
    ){

        inputBuffer = "";

        displayNum.style.display =
            "none";

        abrirGuia();

        return;

    }


    /*
    ================================================
    EVITAR DUPLICADOS
    ================================================
    */

    inputBuffer +=
        digito;


    /*
    ================================================
    MOSTRAR NÚMERO
    ================================================
    */

    displayNum.innerText =
        inputBuffer;

    displayNum.style.display =
        "block";


    /*
    ================================================
    ESPERAR OTRO DÍGITO
    ================================================
    */

    inputTimer =
        setTimeout(
            () => {

                const numero =
                    parseInt(
                        inputBuffer,
                        10
                    );


                const posicion =
                    numero - 1;


                if(
                    !isNaN(numero) &&
                    posicion >= 0 &&
                    posicion < canales.length
                ){

                    cargarCanal(
                        posicion
                    );

                }else{

                    mostrarToast(
                        "Canal no disponible"
                    );

                }


                inputBuffer = "";

                displayNum.style.display =
                    "none";

            },
            1200
        );

}


/* =========================================================
   CONTROL DE TECLADO
   UN SOLO KEYDOWN
========================================================= */

function manejarTeclado(e){

    activarSonido();


    const key =
        String(
            e.key || ""
        ).toLowerCase();


    /*
    ================================================
    0 = LISTA
    ================================================
    */

    if(
        e.key === "0"
    ){

        procesarNumero("0");

        e.preventDefault();

        return;

    }


    /*
    ================================================
    1-9
    ================================================
    */

    if(
        /^[1-9]$/.test(
            e.key
        )
    ){

        procesarNumero(
            e.key
        );

        e.preventDefault();

        return;

    }


    /*
    ================================================
    OK / ENTER
    ================================================
    */

    if(
        key === "enter" ||
        key === "select" ||
        key === "ok" ||
        e.keyCode === 13 ||
        e.keyCode === 23 ||
        e.keyCode === 66
    ){

        if(guideOpen){

            reproducirSeleccion();

        }else{

            abrirGuia();

        }

        e.preventDefault();

        return;

    }


    /*
    ================================================
    ARRIBA
    ================================================
    */

    if(
        key === "arrowup" ||
        e.keyCode === 38
    ){

        if(guideOpen){

            moverFoco(-1);

        }else{

            cargarCanal(
                index + 1
            );

        }

        e.preventDefault();

        return;

    }


    /*
    ================================================
    ABAJO
    ================================================
    */

    if(
        key === "arrowdown" ||
        e.keyCode === 40
    ){

        if(guideOpen){

            moverFoco(1);

        }else{

            cargarCanal(
                index - 1
            );

        }

        e.preventDefault();

        return;

    }


    /*
    ================================================
    IZQUIERDA
    ================================================
    */

    if(
        key === "arrowleft" ||
        e.keyCode === 37
    ){

        if(guideOpen){

            moverFoco(-1);

        }

        e.preventDefault();

        return;

    }


    /*
    ================================================
    DERECHA
    ================================================
    */

    if(
        key === "arrowright" ||
        e.keyCode === 39
    ){

        if(guideOpen){

            moverFoco(1);

        }

        e.preventDefault();

        return;

    }


    /*
    ================================================
    ESC / BACK
    ================================================
    */

    if(
        key === "escape" ||
        key === "back" ||
        key === "browserback" ||
        e.keyCode === 27
    ){

        if(guideOpen){

            cerrarGuia();

        }

        e.preventDefault();

        return;

    }

}


/* =========================================================
   UN SOLO LISTENER
========================================================= */

document.addEventListener(
    "keydown",
    manejarTeclado,
    true
);


/* =========================================================
   MOUSE
========================================================= */

document.addEventListener(
    "mousemove",
    function(e){

        if(guideOpen)
            return;


        if(
            mouseLastY === null
        ){

            mouseLastY =
                e.clientY;

            return;

        }


        const diferencia =
            e.clientY -
            mouseLastY;


        if(
            Math.abs(diferencia) > 70
        ){

            if(
                diferencia > 0
            ){

                cargarCanal(
                    index - 1
                );

            }else{

                cargarCanal(
                    index + 1
                );

            }


            mouseLastY =
                e.clientY;

        }

    }
);


/* =========================================================
   MOUSE SALE
========================================================= */

document.addEventListener(
    "mouseleave",
    () => {

        mouseLastY =
            null;

    }
);


/* =========================================================
   CLICK / TOUCH PARA INICIAR
========================================================= */

document.addEventListener(
    "pointerdown",
    function(){

        activarSonido();

    },
    {
        capture:true
    }
);


/* =========================================================
   INICIO
========================================================= */

window.addEventListener(
    "load",
    async function(){

        /*
        ================================================
        PRIMERO:
        GENERAMOS LOS CANALES ORIGINALES
        ================================================
        */

        generarLista();


        /*
        ================================================
        SIEMPRE INICIAMOS EN EL PRIMER CANAL
        ================================================
        */

        cargarCanal(0);


        /*
        ================================================
        DESPUÉS:
        CARGAMOS IPTV-ORG
        ================================================
        */

        cargarCanalesDominicanos();

    }
);


/* =========================================================
   INICIAR AL HACER CLICK
========================================================= */

overlay.addEventListener(
    "click",
    function(){

        activarSonido();

    }
);


</script>
