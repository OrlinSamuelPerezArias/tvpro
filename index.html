<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TV PRO</title>
<link rel="icon" type="image/x-icon" href="https://png.pngtree.com/element_pic/00/16/09/2057e0eecf792fb.jpg">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
    box-sizing:border-box;
    user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#000;
    color:white;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    cursor:none;
}

/* =====================================================
   VIDEO
===================================================== */

#player{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    object-fit:contain;
    background:#000;
}


/* =====================================================
   PANTALLA INICIAL
===================================================== */

#startOverlay{

    position:fixed;
    inset:0;

    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at center,
            rgba(0,195,255,.10),
            rgba(0,0,0,.96) 70%
        );
}

.startCard{

    width:min(400px,88vw);

    padding:32px;

    text-align:center;

    border-radius:20px;

    background:rgba(10,15,20,.88);

    border:1px solid rgba(0,195,255,.20);

    box-shadow:
        0 25px 80px rgba(0,0,0,.8);

}

.startIcon{
    font-size:48px;
    margin-bottom:10px;
}

.startTitle{

    font-size:30px;

    font-weight:900;

    letter-spacing:3px;

}

.startSubtitle{

    margin-top:5px;

    font-size:14px;

    color:#8999a3;

}

.startHint{

    margin-top:22px;

    padding:12px;

    border-radius:10px;

    background:rgba(0,195,255,.07);

    font-size:13px;

    color:#aabac3;

}

.startHint strong{

    color:#00c3ff;

    font-size:16px;

}


/* =====================================================
   NUMERO MARCADO
===================================================== */

#inputDisplay{

    position:fixed;

    top:7%;

    right:5%;

    z-index:500;

    display:none;

    min-width:65px;

    padding:6px 12px;

    text-align:center;

    font-size:42px;

    line-height:1;

    font-weight:800;

    letter-spacing:2px;

    color:white;

    border-radius:10px;

    background:rgba(0,0,0,.55);

    border:1px solid rgba(255,255,255,.10);

    text-shadow:
        0 0 15px rgba(0,195,255,.7);

}


/* =====================================================
   INFORMACIÓN DEL CANAL
===================================================== */

#infoBar{

    position:fixed;

    left:0;
    bottom:0;

    z-index:300;

    width:100%;

    padding:25px 35px 30px;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.95),
            rgba(0,0,0,.55),
            transparent
        );

    transform:translateY(100%);

    transition:
        transform .3s ease;

}

#infoContent{

    display:flex;

    align-items:center;

    gap:13px;

}

#canalNum{

    min-width:52px;

    font-size:34px;

    font-weight:900;

    color:#00c3ff;

}

#canalLogo{

    width:48px;
    height:48px;

    object-fit:contain;

    padding:5px;

    border-radius:8px;

    background:rgba(255,255,255,.08);

}

#canalNombre{

    font-size:18px;

    font-weight:650;

}

#estado{

    margin-top:3px;

    color:#8c999f;

    font-size:12px;

}


/* =====================================================
   MENSAJE
===================================================== */

#toast{

    position:fixed;

    left:50%;

    bottom:30px;

    z-index:900;

    padding:9px 16px;

    border-radius:20px;

    background:rgba(10,15,20,.9);

    border:1px solid rgba(0,195,255,.20);

    transform:
        translate(-50%,20px);

    opacity:0;

    transition:.2s;

    font-size:13px;

}

#toast.show{

    opacity:1;

    transform:
        translate(-50%,0);

}

</style>

</head>

<body>


<!-- =====================================================
     VIDEO
===================================================== -->

<video
    id="player"
    autoplay
    muted
    playsinline
></video>


<!-- =====================================================
     INICIO
===================================================== -->

<div id="startOverlay">

    <div class="startCard">

        <div class="startIcon">
            📺
        </div>

        <div class="startTitle">
            TV PRO
        </div>

        <div class="startSubtitle">
            Televisión en vivo
        </div>

        <div class="startHint">

            <strong>
                Presiona OK
            </strong>

            <br>

            para comenzar

        </div>

    </div>

</div>


<!-- =====================================================
     NUMERO
===================================================== -->

<div id="inputDisplay"></div>


<!-- =====================================================
     INFORMACIÓN
===================================================== -->

<div id="infoBar">

    <div id="infoContent">

        <div id="canalNum"></div>

        <img
            id="canalLogo"
            src=""
            alt=""
        >

        <div>

            <div id="canalNombre"></div>

            <div id="estado">
                En vivo
            </div>

        </div>

    </div>

</div>


<div id="toast"></div>


<script>


/* =====================================================
   CANALES ORIGINALES
   ESTOS SIEMPRE SERÁN LOS PRIMEROS
===================================================== */

let canales = [

    {
        nombre:"La Voz de María",
        url:"https://live.lavozdemaria.com:3436/live/lavozdemarialive.m3u8",
        logo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScjT6ySNR02aPjARG_jnWlIe1mgABegRlk2A&s"
    },

    {
        nombre:"Jarabacoa TV",
        url:"https://streaming.jarabacoatv.com/Jarabacoa_tv/playlist.m3u8",
        logo:"https://cablevisionjarabacoa.com/wp-content/uploads/2023/05/JCA_Artboard-1-copy-3.png"
    },

    {
        nombre:"La Voz de Jesús",
        url:"https://live20.bozztv.com/giatvplayout7/giatv-208429/playlist.m3u8",
        logo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTjKQpOjimwanvyUmwkYeDrdACXWNABgZHghQ&s"
    },

    {
        nombre:"Telever",
        url:"https://soportedvb.click:3413/live/televerlive.m3u8",
        logo:"https://telever.com.do/wp-content/uploads/2025/07/LOGO-FINAL.svg"
    },

    {
        nombre:"Teleuniverso",
        url:"https://videoserver.tmcreativos.com:19360/kptjeckkaa/kptjeckkaa.m3u8",
        logo:"https://stscdn.teleuniversotv.com/wp-content/uploads/2020/11/Teleuniverso.webp"
    },

    {
        nombre:"6 Wise TV",
        url:"https://live.enhdtv.com:8081/8150/index.m3u8",
        logo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR9JTxrz_0LCVISHKDdzNmZfi9tVwQs174J4Q&s"
    },

    {
        nombre:"Univision Noticias",
        url:"https://amg26269-dogtv-amg26269c2-stirr-us-8504.playouts.now.amagi.tv/playlist.m3u8",
        logo:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTkoMy8wfofxfOljm8fKQ9mxO2nIkdZ10U37g&s"
    },

    {
        nombre:"Canal 4 RD",
        url:"https://sh1.domint.net:19360/rtvd/rtvd/playlist.m3u8",
        logo:"https://certvdominicana.com/wp-content/uploads/2021/04/Logo-Canal-4RD.png"
    }

];


/* =====================================================
   IPTV-ORG
===================================================== */

const IPTV_RD =
    "https://iptv-org.github.io/iptv/countries/do.m3u";


/* =====================================================
   VARIABLES
===================================================== */

let index = 0;

let hls = null;

let sonidoActivado = false;

let inputBuffer = "";

let inputTimer = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const video =
    document.getElementById("player");

const overlay =
    document.getElementById("startOverlay");

const bar =
    document.getElementById("infoBar");

const displayNum =
    document.getElementById("inputDisplay");

const toast =
    document.getElementById("toast");


/* =====================================================
   TOAST
===================================================== */

function mostrarToast(texto){

    toast.innerText =
        texto;

    toast.classList.add("show");

    clearTimeout(
        toast.timer
    );

    toast.timer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            1600
        );

}


/* =====================================================
   ACTIVAR SONIDO
===================================================== */

function activarSonido(){

    if(sonidoActivado)
        return;

    sonidoActivado = true;

    video.muted = false;

    video.volume = 1;

    overlay.style.display = "none";

    video.play().catch(() => {});

}


/* =====================================================
   INFORMACIÓN
===================================================== */

function mostrarBarra(
    estado = "En vivo"
){

    const canal =
        canales[index];

    if(!canal)
        return;


    /*
       El canal visualmente empieza en 0.
       
       Por eso:
       índice 0 = canal 0
       índice 1 = canal 1
       etc.
    */

    document.getElementById(
        "canalNum"
    ).innerText =
        String(index);


    document.getElementById(
        "canalNombre"
    ).innerText =
        canal.nombre;


    document.getElementById(
        "canalLogo"
    ).src =
        canal.logo || "";


    document.getElementById(
        "estado"
    ).innerText =
        estado;


    bar.style.transform =
        "translateY(0)";


    clearTimeout(
        bar.timer
    );


    bar.timer =
        setTimeout(
            () => {

                bar.style.transform =
                    "translateY(100%)";

            },
            3000
        );

}


/* =====================================================
   CARGAR CANAL
===================================================== */

function cargarCanal(numero){

    if(
        !canales.length
    )
        return;


    /*
       CICLO DE CANALES

       Si estamos en 0 y bajamos:
       último canal.

       Si estamos en el último y subimos:
       canal 0.
    */

    index =
        (
            numero +
            canales.length
        ) %
        canales.length;


    if(hls){

        hls.destroy();

        hls = null;

    }


    const canal =
        canales[index];

    const url =
        canal.url;


    mostrarBarra(
        "Cargando..."
    );


    if(
        Hls.isSupported()
    ){

        hls =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                backBufferLength:30

            });


        hls.loadSource(
            url
        );


        hls.attachMedia(
            video
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                video.play()
                    .catch(() => {});

                mostrarBarra(
                    "● En vivo"
                );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function(
                event,
                data
            ){

                if(data.fatal){

                    mostrarBarra(
                        "Sin señal"
                    );

                }

            }
        );


    }else{

        video.src =
            url;

        video.play()
            .catch(() => {});

    }

}


/* =====================================================
   PARSEAR M3U
===================================================== */

function parseM3U(text){

    const lines =
        text.split(/\r?\n/);

    const resultado = [];

    let info = null;


    for(
        let i = 0;
        i < lines.length;
        i++
    ){

        const line =
            lines[i].trim();


        if(
            line.startsWith(
                "#EXTINF"
            )
        ){

            const nombreMatch =
                line.match(
                    /,(.*)$/
                );


            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );


            info = {

                nombre:
                    nombreMatch
                        ? nombreMatch[1].trim()
                        : "Canal",

                logo:
                    logoMatch
                        ? logoMatch[1]
                        : ""

            };

        }

        else if(

            info &&
            line &&
            !line.startsWith("#")

        ){

            resultado.push({

                nombre:
                    info.nombre,

                url:
                    line,

                logo:
                    info.logo

            });


            info = null;

        }

    }


    return resultado;

}


/* =====================================================
   CARGAR CANALES IPTV-ORG
===================================================== */

async function cargarCanalesIPTV(){

    try{

        const response =
            await fetch(
                IPTV_RD,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "No se pudo descargar IPTV-org"
            );

        }


        const text =
            await response.text();


        const nuevos =
            parseM3U(
                text
            );


        /*
        =================================================
        NO ELIMINAMOS LOS CANALES ORIGINALES
        =================================================
        */

        const urlsExistentes =
            new Set(
                canales.map(
                    c => c.url
                )
            );


        let agregados = 0;


        for(
            const canal of nuevos
        ){

            /*
            Sin límite de 260.
            Agregamos todos los que
            IPTV-org entregue.
            */

            if(
                canal.url &&
                !urlsExistentes.has(
                    canal.url
                )
            ){

                canales.push(
                    canal
                );

                urlsExistentes.add(
                    canal.url
                );

                agregados++;

            }

        }


        console.log(
            "Canales originales:",
            8
        );

        console.log(
            "Canales IPTV-org:",
            agregados
        );

        console.log(
            "TOTAL:",
            canales.length
        );


    }catch(error){

        console.error(
            "Error IPTV-org:",
            error
        );


        mostrarToast(
            "No se pudieron cargar canales adicionales"
        );

    }

}


/* =====================================================
   NUMERACIÓN

   MUY IMPORTANTE:

   El 0 ahora NO tiene ninguna función especial.

   Es simplemente un dígito.

   Ejemplo:

   0       = canal 0
   1       = canal 1
   10      = canal 10
   20      = canal 20
   105     = canal 105
===================================================== */

function marcarNumero(
    digito
){

    clearTimeout(
        inputTimer
    );


    inputBuffer +=
        digito;


    displayNum.innerText =
        inputBuffer;


    displayNum.style.display =
        "block";


    inputTimer =
        setTimeout(
            () => {

                cambiarPorNumero();

            },
            1200
        );

}


/* =====================================================
   CAMBIAR POR NUMERO
===================================================== */

function cambiarPorNumero(){

    if(
        inputBuffer === ""
    )
        return;


    const numero =
        parseInt(
            inputBuffer,
            10
        );


    /*
       IMPORTANTE:

       El canal 0 corresponde
       al índice 0.

       Canal 10 corresponde
       al índice 10.
    */

    if(
        !isNaN(numero) &&
        numero >= 0 &&
        numero < canales.length
    ){

        cargarCanal(
            numero
        );

    }

    else{

        mostrarToast(
            "Canal " +
            numero +
            " no disponible"
        );

    }


    inputBuffer =
        "";


    displayNum.style.display =
        "none";

}


/* =====================================================
   TECLADO

   UN SOLO LISTENER.
   Esto evita que 1 termine convirtiéndose en 11.
===================================================== */

function manejarTeclado(e){

    activarSonido();


    const key =
        String(
            e.key || ""
        ).toLowerCase();


    const code =
        e.keyCode;


    /* ================================================
       TODOS LOS NÚMEROS
       
       INCLUYE 0
       ================================================ */

    if(
        /^[0-9]$/.test(
            e.key
        )
    ){

        marcarNumero(
            e.key
        );

        e.preventDefault();

        e.stopPropagation();

        return;

    }


    /* ================================================
       CANAL ARRIBA
       ================================================ */

    if(

        key === "arrowup" ||
        key === "up" ||
        key === "channelup" ||
        key === "ch+" ||
        key === "pageup" ||

        code === 38 ||
        code === 33

    ){

        /*
           Siguiente canal
        */

        inputBuffer = "";

        displayNum.style.display =
            "none";

        cargarCanal(
            index + 1
        );

        e.preventDefault();

        e.stopPropagation();

        return;

    }


    /* ================================================
       CANAL ABAJO
       ================================================ */

    if(

        key === "arrowdown" ||
        key === "down" ||
        key === "channeldown" ||
        key === "ch-" ||
        key === "pagedown" ||

        code === 40 ||
        code === 34

    ){

        /*
           Canal anterior
        */

        inputBuffer = "";

        displayNum.style.display =
            "none";

        cargarCanal(
            index - 1
        );

        e.preventDefault();

        e.stopPropagation();

        return;

    }


    /* ================================================
       ENTER / OK
       ================================================ */

    if(

        key === "enter" ||
        key === "select" ||
        key === "ok" ||

        code === 13 ||
        code === 23

    ){

        if(
            inputBuffer !== ""
        ){

            cambiarPorNumero();

        }

        else{

            mostrarBarra(
                "● En vivo"
            );

        }


        e.preventDefault();

        e.stopPropagation();

        return;

    }


    /* ================================================
       ESC / BACK
       ================================================ */

    if(

        key === "escape" ||
        key === "back" ||
        key === "browserback" ||

        code === 27

    ){

        inputBuffer = "";

        displayNum.style.display =
            "none";

        clearTimeout(
            inputTimer
        );

        e.preventDefault();

        e.stopPropagation();

        return;

    }

}


/* =====================================================
   ÚNICO EVENTO DE TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    manejarTeclado,
    true
);


/* =====================================================
   CLICK / TOUCH
===================================================== */

document.addEventListener(
    "pointerdown",
    function(){

        activarSonido();

    },
    true
);


/* =====================================================
   INICIO
===================================================== */

window.addEventListener(
    "load",
    async function(){

        /*
        PRIMERO:

        Cargamos inmediatamente
        tu primer canal.

        Así nunca dependemos
        de IPTV-org para arrancar.
        */

        cargarCanal(0);


        /*
        DESPUÉS:

        Descargamos todos los
        canales dominicanos.
        */

        await cargarCanalesIPTV();

    }
);


/* =====================================================
   CLICK EN INICIO
===================================================== */

overlay.addEventListener(
    "click",
    function(){

        activarSonido();

    }
);

</script>

</body>
</html>
