}


/* =====================================================
   PARSEAR M3U
===================================================== */

function parseM3U(text){

    const lines =
        text.split(/\r?\n/);

    const resultado = [];

    let info = null;


    for(
        let i = 0;
        i < lines.length;
        i++
    ){

        const line =
            lines[i].trim();


        if(
            line.startsWith(
                "#EXTINF"
            )
        ){

            const nombreMatch =
                line.match(
                    /,(.*)$/
                );


            const logoMatch =
                line.match(
                    /tvg-logo="([^"]*)"/
                );


            info = {
                id: (line.match(/tvg-id="([^"]*)"/) || [,""])[1],
                categorias: (line.match(/group-title="([^"]*)"/) || [,""])[1],

                nombre:
                    nombreMatch
                        ? nombreMatch[1].trim()
                        : "Canal",

                logo:
                    logoMatch
                        ? logoMatch[1]
                        : ""

            };

        }

        else if(

            info &&
            line &&
            !line.startsWith("#")

        ){

            resultado.push({
                id: info.id,
                categorias: info.categorias,

                nombre:
                    info.nombre,

                url:
                    line,

                logo:
                    info.logo

            });


            info = null;

        }

    }


    return resultado;

}

function prioridadRD(canal){
    if(canal.internacional) return 6;
    const nombre = canal.nombre.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
    const grupos = [
        /\b(?:tele\s*antillas|(?:canal\s*)0?2)\b/,
        /\b(?:telemicro|(?:canal\s*)0?5)\b/,
        /\b(?:antena\s*7|(?:canal\s*)0?7)\b/,
        /\b(?:color\s*vision|(?:canal\s*)0?9)\b/,
        /\b(?:telesistema|(?:canal\s*)11)\b/,
        /\b(?:digital\s*15|(?:canal\s*)15)\b/
    ];
    // Telemicro Internacional no representa el canal nacional 5.
    if(/internacional/.test(nombre)) return grupos.length;
    const posicion = grupos.findIndex(patron => patron.test(nombre));
    return posicion < 0 ? grupos.length : posicion;
}


function preferirAudioEspanol(motor){
    motor.on(Hls.Events.AUDIO_TRACKS_UPDATED, () => {
        const pista = motor.audioTracks.findIndex(t =>
            /^(?:es|spa)(?:-|$)/i.test(t.lang || "") ||
            /espa[nñ]ol|spanish|castellano/i.test(t.name || ""));
        if(pista >= 0) motor.audioTrack = pista;
    });
}

// Verifica la disponibilidad sin abrir videos: la TV solo decodifica el canal principal.
async function comprobarReproduccion(url){
    const controlador = new AbortController();
    const limite = setTimeout(() => controlador.abort(),10000);
    try{
        let actual = url;
        for(let nivel=0;nivel<4;nivel++){
            const respuesta = await fetch(actual,{signal:controlador.signal});
            if(!respuesta.ok) return false;
            const texto = await respuesta.text();
            if(!texto.trimStart().startsWith("#EXTM3U")) return false;
            const lineas = texto.split(/\r?\n/).map(l=>l.trim());
            const ruta = lineas.find(l=>l && !l.startsWith("#"));
            if(!ruta) return false;
            const destino = new URL(ruta,respuesta.url || actual).href;
            if(lineas.some(l=>l.startsWith("#EXT-X-STREAM-INF"))){
                actual = destino;
                continue;
            }
            if(!lineas.some(l=>l.startsWith("#EXTINF"))) return false;
            const segmento = await fetch(destino,{signal:controlador.signal});
            if(!segmento.ok){if(segmento.body) await segmento.body.cancel();return false;}
            if(!segmento.body || !segmento.body.getReader) return false;
            const lector = segmento.body.getReader();
            try{
                const muestra = await lector.read();
                return !!muestra.value?.byteLength;
            }finally{
                await lector.cancel();
            }
        }
        return false;
    }catch(error){
        return false;
    }finally{
        clearTimeout(limite);
        controlador.abort();
    }
}

const FUENTES_CANALES = [
    {nombre:"Free-TV", url:"https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8"},
    {nombre:"Internacional", url:"https://iptv-org.github.io/iptv/index.m3u"},
    {nombre:"TDTChannels", url:"https://www.tdtchannels.com/lists/tv.m3u8"},
    {nombre:"RD", url:IPTV_RD}
];
function esDeporte(canal){
    return /(?:^|[;,])\s*(?:sports?|deportes?)\s*(?:$|[;,])/i.test(canal.categorias || "");
}
function esPreferido(nombre){
    return /\b(?:disney|fox|fx|nickelodeon|nick\s*jr|cartoon\s*network|dreamworks|discovery\s*kids|boomerang)\b/i.test(nombre);
}
function prioridadCanal(canal){
    const rd = prioridadRD(canal);
    if(rd < 6) return rd;
    if(esPreferido(canal.nombre)) return 6;
    return 7;
}
function fuenteBloqueada(url){
    // Esta señal devuelve el video de bloqueo regional mostrado por el usuario.
    return /^https?:\/\/cdn4\.wind\.do\/streams\/telesistema\//i.test(url);
}
async function descargarLista(fuente){
    const controlador = new AbortController();
    const limite = setTimeout(() => controlador.abort(), 20000);
    try{
        const respuesta = await fetch(fuente.url, {
            cache:"no-store", signal:controlador.signal
        });
        if(!respuesta.ok) throw new Error(fuente.nombre + ": " + respuesta.status);
        const texto = await respuesta.text();
        if(!texto.trimStart().startsWith("#EXTM3U")) throw new Error("Lista inválida");
        return parseM3U(texto).map(c => ({
            ...c, fuente:fuente.nombre,
            id: fuente.nombre === "TDTChannels" && /^(La1|La2|Antena3|Telecinco|Cuatro|Clan|Boing|Neox|Nova)\.TV$/.test(c.id) ? c.id.replace(/\.TV$/, ".es") : c.id,
            internacional:fuente.nombre !== "RD" && !/\.do(?:@|$)/i.test(c.id || "")
        }));
    }finally{
        clearTimeout(limite);
    }
}

function crearFiltroEspanol(feeds){
    const porFeed = new Map(feeds.map(f => [f.channel + "@" + f.id, f]));
    const principales = new Map(feeds.filter(f => f.is_main).map(f => [f.channel, f]));
    return canal => {
        const ficha = canal.id.includes("@") ? porFeed.get(canal.id) : principales.get(canal.id);
        if(!ficha || !Array.isArray(ficha.languages)) return false;
        const espanol = ficha.languages.includes("spa");
        return espanol || (esDeporte(canal) && ficha.languages.includes("eng"));
    };
}
async function cargarCanalesIPTV(){
    const contador = document.getElementById("contadorCanales");
    const actualizar = mensaje => {
        contador.textContent = "Canales encontrados: " + canales.length + " · " + mensaje;
    };
    actualizar("Consultando idiomas...");
    let esEspanol;
    const controlador = new AbortController();
    const limite = setTimeout(() => controlador.abort(),20000);
    try{
        const respuesta = await fetch("https://iptv-org.github.io/api/feeds.json",{signal:controlador.signal});
        if(!respuesta.ok) throw new Error("Idiomas no disponibles");
        const feeds = await respuesta.json();
        if(!Array.isArray(feeds)) throw new Error("Formato de idiomas inválido");
        esEspanol = crearFiltroEspanol(feeds);
    }catch(error){
        actualizar("No se pudo verificar el idioma; recarga para reintentar");
        return;
    }finally{
        clearTimeout(limite);
    }
    const fijos = canales.slice();
    const existentes = new Set(canales.map(c => c.url));
    const agregados = new Set();
    const clave = c => c.id.split("@")[0].toLowerCase();

    actualizar("Consultando " + FUENTES_CANALES.length + " fuentes...");
    const resultados = await Promise.allSettled(FUENTES_CANALES.map(descargarLista));
    const disponibles = resultados.filter(r => r.status === "fulfilled");
    const candidatos = disponibles.flatMap(r=>r.value).filter(c=>{
        if(!esEspanol(c) || !/^https?:\/\//i.test(c.url) || fuenteBloqueada(c.url) || existentes.has(c.url)) return false;
        existentes.add(c.url);
        return true;
    }).sort((a,b)=>prioridadCanal(a)-prioridadCanal(b) ||
        Number(!/disney/i.test(a.nombre))-Number(!/disney/i.test(b.nombre)));
    for(let posicion=0;posicion<candidatos.length;posicion+=1){
        const lote=candidatos.slice(posicion,posicion+1);
        actualizar(disponibles.length+"/"+FUENTES_CANALES.length+" fuentes · Verificando "+(posicion+1)+"–"+Math.min(posicion+1,candidatos.length)+"/"+candidatos.length);
        const visibles=await Promise.all(lote.map(c=>agregados.has(clave(c))?false:comprobarReproduccion(c.url)));
        lote.forEach((c,i)=>{
            if(visibles[i] && !agregados.has(clave(c))){
                agregados.add(clave(c));
                canales.push(c);
            }
        });
    }
    const disney=canales.some(c=>/disney/i.test(c.nombre));
    actualizar(disponibles.length+"/"+FUENTES_CANALES.length+" fuentes · "+(disponibles.length?"Búsqueda completada":"No se pudieron cargar las listas")+
        (disney?"":" · Disney: sin señal verificada"));
}

/* =====================================================
   NUMERACIÓN

   MUY IMPORTANTE:

   El 0 ahora NO tiene ninguna función especial.

   Es simplemente un dígito.

   Ejemplo:

   0       = canal 0
   1       = canal 1
   10      = canal 10
   20      = canal 20
   105     = canal 105
===================================================== */

function marcarNumero(
    digito
){

    clearTimeout(
        inputTimer
    );


    inputBuffer +=
        digito;


    displayNum.innerText =
        inputBuffer;


    displayNum.style.display =
        "block";


    inputTimer =
        setTimeout(
            () => {

                cambiarPorNumero();

            },
            1200
        );

}


/* =====================================================
   CAMBIAR POR NUMERO
===================================================== */

function cambiarPorNumero(){

    if(
        inputBuffer === ""
    )
        return;


    const numero =
        parseInt(
            inputBuffer,
            10
        );


    /*
       IMPORTANTE:

       El canal 0 corresponde
       al índice 0.

       Canal 10 corresponde
       al índice 10.
    */

    if(
        !isNaN(numero) &&
        numero >= 0 &&
        numero < canales.length
    ){

        cargarCanal(
            numero
        );

    }

    else{

        mostrarToast(
            "Canal " +
            numero +
            " no disponible"
        );

    }


    inputBuffer =
        "";


    displayNum.style.display =
        "none";

}


/* =====================================================
   TECLADO

   UN SOLO LISTENER.
   Esto evita que 1 termine convirtiéndose en 11.
===================================================== */

function manejarTeclado(e){

    activarSonido();


    const key =
        String(
            e.key || ""
        ).toLowerCase();


    const code =
        e.keyCode;


    /* ================================================
       TODOS LOS NÚMEROS
       
       INCLUYE 0
       ================================================ */

    if(
        /^[0-9]$/.test(
            e.key
        )
    ){

        marcarNumero(
            e.key
        );

        e.preventDefault();

        e.stopPropagation();

        return;

    }


    /* ================================================
       CANAL ARRIBA
       ================================================ */

    if(

        key === "arrowup" ||
        key === "up" ||
        key === "channelup" ||
        key === "ch+" ||
        key === "pageup" ||

        code === 38 ||
        code === 33

    ){

        /*
           Siguiente canal
        */

        inputBuffer = "";

        displayNum.style.display =
            "none";

        cargarCanal(
            index + 1
        );

        e.preventDefault();

        e.stopPropagation();

        return;

    }


    /* ================================================
       CANAL ABAJO
       ================================================ */

    if(

        key === "arrowdown" ||
        key === "down" ||
        key === "channeldown" ||
        key === "ch-" ||
        key === "pagedown" ||

        code === 40 ||
        code === 34

    ){

        /*
           Canal anterior
        */

        inputBuffer = "";

        displayNum.style.display =
            "none";

        cargarCanal(
            index - 1
        );

        e.preventDefault();

        e.stopPropagation();

        return;

    }


    /* ================================================
       ENTER / OK
       ================================================ */

    if(

        key === "enter" ||
        key === "select" ||
        key === "ok" ||

        code === 13 ||
        code === 23

    ){

        if(
            inputBuffer !== ""
        ){

            cambiarPorNumero();

        }

        else{

            mostrarBarra(
                "● En vivo"
            );

        }


        e.preventDefault();

        e.stopPropagation();

        return;

    }


    /* ================================================
       ESC / BACK
       ================================================ */

    if(

        key === "escape" ||
        key === "back" ||
        key === "browserback" ||

        code === 27

    ){

        inputBuffer = "";

        displayNum.style.display =
            "none";

        clearTimeout(
            inputTimer
        );

        e.preventDefault();

        e.stopPropagation();

        return;

    }

}


/* =====================================================
   ÚNICO EVENTO DE TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    manejarTeclado,
    true
);


/* =====================================================
   CLICK / TOUCH
===================================================== */

document.addEventListener(
    "pointerdown",
    function(){

        activarSonido();

    },

);
